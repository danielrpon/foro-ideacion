<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="20260911a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freaknerd_ · Foro de Ideación · Admin</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<style>summary{list-style:none}summary::-webkit-details-marker{display:none}body{font-family:Montserrat,ui-sans-serif,system-ui,sans-serif}.fn-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}.fn-green{color:#26E57C}.bg-fn{background:#0A0B0D}</style>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<script src="vendor/supabase.min.js"></script>
<script src="js/config.js?v=20260911a"></script><script src="js/db.js?v=20260911a"></script><script src="js/common.js?v=20260911a"></script><script src="js/mece-ui.js?v=20260911a"></script><script src="js/demo-data.js?v=20260911a"></script>
<style>.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}} .tab{display:none}.tab.on{display:block}</style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">
<nav data-nav class="bg-fn text-white p-3 flex justify-between items-center shadow-md sticky top-0 z-50 border-b border-emerald-500/30"></nav>
<div id="errBanner" hidden class="bg-red-600 text-white text-xs text-center py-1"></div>
<main class="flex-1 p-4"><div id="app" class="max-w-7xl mx-auto"></div></main>

<!-- Modal CRUD -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-[90] flex items-center justify-center p-4"><div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto p-6">
  <h3 id="mTitle" class="text-xl font-black mb-4">Editar</h3><input type="hidden" id="mId">
  <div class="grid md:grid-cols-2 gap-3">
    <div><label class="text-xs font-bold">Tipo</label><select id="mTipo" class="w-full p-2 border rounded bg-white" onchange="modalTipo()"><option value="idea">Idea (aporte)</option><option value="grupo">Idea consolidada (grupo)</option></select></div>
    <div><label class="text-xs font-bold">Pilar</label><select id="mPilar" class="w-full p-2 border rounded bg-white"></select></div>
    <div id="mEstadoBox"><label class="text-xs font-bold">Estado</label><select id="mEstado" class="w-full p-2 border rounded bg-white"><option value="nueva">Nueva</option><option value="validada">Validada</option><option value="repetida">Repetida</option><option value="agrupada">Agrupada</option></select></div>
    <div><label class="text-xs font-bold">Frente (subfrente)</label><input id="mSub" class="w-full p-2 border rounded"></div>
  </div>
  <div class="mt-3" id="mTextoBox"><label class="text-xs font-bold">Texto de la idea</label><textarea id="mTexto" rows="3" class="w-full p-2 border rounded"></textarea></div>
  <div class="mt-3 grid md:grid-cols-2 gap-3" id="mGrupoBox"><div class="md:col-span-2"><label class="text-xs font-bold">Título de la solución</label><input id="mTitulo" class="w-full p-2 border rounded font-bold"></div><div class="md:col-span-2"><label class="text-xs font-bold">Descripción corta (muro, máx. 160)</label><input id="mCorta" maxlength="160" class="w-full p-2 border rounded"></div><div class="md:col-span-2"><label class="text-xs font-bold">Detalle (reporte)</label><textarea id="mDetalle" rows="3" class="w-full p-2 border rounded"></textarea></div><div><label class="text-xs font-bold">Responsable</label><input id="mResp" class="w-full p-2 border rounded"></div><div><label class="text-xs font-bold">Tiempo de ejecución</label><input id="mTiempo" class="w-full p-2 border rounded" placeholder="Ej. 30 días"></div></div>
  <div class="flex gap-2 mt-5"><button onclick="guardarModal()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold">Guardar</button><button onclick="cerrarModal()" class="flex-1 bg-gray-200 py-2 rounded-lg">Cancelar</button></div>
</div></div>

<script>
let snap = null, parts = [], abiertos = { opc: false, hijas: {} }, tab = sessionStorage.getItem('foro_admin_tab') || 'control', meceMontado = false, busq = '';
renderNav('admin');
async function cargar() { snap = await DB.snapshot(); if (DB.clave) parts = await DB.getParticipantes(); setNavEtapa(snap.sesion); render(); }
const grupos = () => calificables(snap.ideas);
const ideas = () => snap.ideas.filter(i => i.tipo === 'idea');
async function op(o, p, msg) { try { const r = await DB.admin(o, p); if (msg) toast(msg); await cargar(); return r; } catch (e) { toast(errMsg(e), 'err'); } }
function semaforo(p) { return p >= 80 ? 'text-emerald-600' : p >= 40 ? 'text-amber-500' : 'text-red-500'; }

function render() {
  const app = $('app'), s = snap.sesion;
  if (!DB.clave || sessionStorage.getItem('foro_rol_' + DB.SES) !== 'admin') {
    if ($('lgClave')) return; // no redibujar el login mientras se escribe
    app.innerHTML = `<div class="flex items-center justify-center mt-16"><div class="bg-white p-8 rounded-lg shadow-lg w-96 fade-in"><h2 class="text-2xl font-bold text-center mb-6"><i class="fas fa-user-shield mr-2"></i>Acceso Administrador</h2><input id="lgClave" type="password" class="w-full p-2 border rounded mb-4" placeholder="Clave de administrador" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" class="w-full bg-fn text-emerald-400 font-bold py-2 rounded hover:bg-gray-800">Ingresar</button>${DB.MODE === 'local' ? '<p class="text-[11px] text-gray-400 mt-3 text-center">Demo local: clave <b>admin</b></p>' : ''}</div></div>`; return;
  }
  const gs = grupos(), ids = ideas(), np = Math.max(snap.conectados, 1);
  const kpi = { ideas: ids.length, rep: ids.filter(i => i.estado === 'repetida').length, nuevas: ids.filter(i => i.estado === 'nueva').length, agrup: ids.filter(i => i.estado === 'agrupada').length, grupos: gs.length, votos: gs.reduce((a, g) => a + g.votos, 0), evalTot: gs.reduce((a, g) => a + g.conteo_eval, 0), evalMax: maxCalif(s, gs.length) * np };
  const pDep = pct(ids.length - kpi.nuevas, ids.length), pCob = pct(kpi.agrup + kpi.rep, ids.length), pEval = pct(kpi.evalTot, kpi.evalMax);
  if (!$('layout')) {
    app.innerHTML = `<div id="layout" class="fade-in">
      <div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h1 class="text-2xl font-black"><i class="fas fa-gauge-high mr-2"></i>Dashboard de control</h1><div class="text-xs text-gray-500">${esc(s.nombre)} · ${esc(s.facilitador || '')}</div></div>
        <div class="flex flex-wrap gap-2 text-xs font-bold"><a href="${urlVista('muro.html')}" target="_blank" class="bg-fn text-emerald-400 px-4 py-2 rounded-lg"><i class="fas fa-tv mr-1"></i>PROYECTAR (muro)</a><a href="${urlVista('index.html')}" target="_blank" class="bg-gray-700 text-white px-3 py-2 rounded-lg"><i class="fas fa-mobile-screen mr-1"></i>Participante</a><a href="${urlVista('area.html')}" target="_blank" class="bg-gray-700 text-white px-3 py-2 rounded-lg"><i class="fas fa-users-gear mr-1"></i>Gestión</a><a href="${urlVista('reporte.html')}" target="_blank" class="bg-gray-700 text-white px-3 py-2 rounded-lg"><i class="fas fa-file-lines mr-1"></i>Reporte</a><a href="manual.html" target="_blank" class="bg-gray-200 px-3 py-2 rounded-lg"><i class="fas fa-book mr-1"></i>Manual</a><button onclick="logout()" class="bg-gray-200 px-3 py-2 rounded-lg">Salir</button></div></div>
      <div class="flex gap-1 mb-4 border-b flex-wrap">${[['control', 'fa-sliders', 'Control'], ['ia', 'fa-wand-magic-sparkles', 'IA · MECE'], ['matriz', 'fa-chart-line', 'Matriz'], ['ideas', 'fa-table-list', 'Ideas'], ['pilares', 'fa-columns', 'Pilares'], ['participantes', 'fa-users', 'Participantes'], ['config', 'fa-gear', 'Configuración']].map(([k, i, l]) => `<button onclick="setTab('${k}')" data-tab="${k}" class="px-4 py-2 text-sm font-bold border-b-2 ${tab === k ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-gray-500'}"><i class="fas ${i} mr-1"></i>${l}</button>`).join('')}</div>
      <div id="tab-control" class="tab"></div><div id="tab-ia" class="tab"></div><div id="tab-matriz" class="tab"></div><div id="tab-ideas" class="tab"></div><div id="tab-pilares" class="tab"></div><div id="tab-participantes" class="tab"></div><div id="tab-config" class="tab"></div></div>`;
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.className = 'px-4 py-2 text-sm font-bold border-b-2 ' + (b.dataset.tab === tab ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-gray-500'));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + tab));

  /* CONTROL */
  const st = stageInfo(s.etapa);
  const tmPrev = $('tmMin'); const tmFocus = tmPrev && document.activeElement === tmPrev; const tmVal = tmPrev && tmPrev.dataset.user === '1' ? tmPrev.value : (s.config[st.timer] || s.config.minutos_ideacion || 10);
  $('tab-control').innerHTML = `
    <div class="grid md:grid-cols-4 gap-3 mb-4">
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs font-bold uppercase text-gray-500">Conectados</div><div class="text-3xl font-black">${snap.conectados}<span class="text-sm text-gray-400 font-normal"> / ${parts.length} registrados</span></div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs font-bold uppercase text-gray-500">Avance depuración</div><div class="text-3xl font-black ${semaforo(pDep)}">${pDep}%</div><div class="text-xs text-gray-400">${ids.length - kpi.nuevas} de ${ids.length} ideas revisadas</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs font-bold uppercase text-gray-500">Cobertura consolidación</div><div class="text-3xl font-black ${semaforo(pCob)}">${pCob}%</div><div class="text-xs text-gray-400">${kpi.agrup} agrupadas · ${kpi.rep} repetidas · ${gs.length} grupos</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs font-bold uppercase text-gray-500">Progreso matriz</div><div class="text-3xl font-black ${semaforo(pEval)}">${pEval}%</div><div class="text-xs text-gray-400">${kpi.evalTot} de ${kpi.evalMax} calificaciones · ${kpi.votos} votos</div></div></div>
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-xl shadow p-4"><div class="flex justify-between items-center mb-3"><h3 class="font-black"><i class="fas fa-list-ol mr-1"></i>Etapa actual: <span class="text-blue-700">${st.n} · ${st.label}</span></h3><span class="font-mono text-2xl font-black ${timerVencido(s) ? 'text-red-600' : ''}" id="tmrA">${(s.fin_etapa || ['ideacion', 'matriz'].includes(s.etapa)) ? timerText(s) : ''}</span></div>
        <div class="grid md:grid-cols-2 gap-2">${STAGES.filter(x => !x.opcional).map(x => `<button onclick="cambiarEtapa('${x.key}')" class="w-full p-3 text-left rounded-lg text-sm font-semibold border ${s.etapa === x.key ? 'bg-blue-600 text-white ring-2 ring-blue-300' : 'bg-gray-50 hover:bg-gray-100 border-gray-200 text-gray-700'}"><span class="font-mono text-xs opacity-70 mr-2">${x.n}</span>${x.label}${x.timer ? ` <span class="text-[10px] opacity-60">⏱ ${s.config[x.timer] || ''} min</span>` : ''}</button>`).join('')}</div>
        <details class="mt-3" ${abiertos.opc ? 'open' : ''} ontoggle="abiertos.opc=this.open"><summary class="text-xs text-gray-500 cursor-pointer">Etapas opcionales (votación por votos, pantallas de instrucciones extra)</summary><div class="grid md:grid-cols-2 gap-2 mt-2">${STAGES.filter(x => x.opcional).map(x => `<button onclick="cambiarEtapa('${x.key}')" class="w-full p-2 text-left rounded-lg text-xs font-semibold border ${s.etapa === x.key ? 'bg-blue-600 text-white ring-2 ring-blue-300' : 'bg-white hover:bg-gray-100 border-gray-200 text-gray-500'}"><span class="font-mono opacity-70 mr-2">${x.n}</span>${x.label}</button>`).join('')}</div></details></div>
      <div class="space-y-4"><div class="bg-white rounded-xl shadow p-4"><h3 class="font-black mb-2"><i class="fas fa-stopwatch mr-1"></i>Temporizador</h3><div class="flex gap-2"><input id="tmMin" type="number" value="${tmVal}" min="1" class="w-20 p-2 border rounded" oninput="this.dataset.user='1'" data-user="${tmPrev && tmPrev.dataset.user === '1' ? '1' : '0'}"><button onclick="$('tmMin').dataset.user='0';op('temporizador',{minutos:Number($('tmMin').value)},'Temporizador iniciado')" class="flex-1 bg-gray-800 text-white rounded text-sm font-bold">Iniciar</button></div><div class="flex gap-1 mt-2">${[3, 5, 8, 10].map(m => `<button onclick="op('temporizador',{minutos:${m}},'Temporizador: ${m} min')" class="flex-1 bg-gray-100 hover:bg-gray-200 rounded py-1.5 text-xs font-bold">${m}'</button>`).join('')}</div><div class="flex gap-2 mt-2"><button onclick="op('temporizador',{minutos:5,extender:true},'+5 minutos')" class="flex-1 bg-amber-500 text-white rounded py-2 text-sm font-bold">+5 min</button><button onclick="op('temporizador',{minutos:0},'Temporizador apagado')" class="flex-1 bg-gray-200 rounded py-2 text-sm">Apagar</button></div></div>
        <div class="bg-white rounded-xl shadow p-4"><h3 class="font-black mb-2"><i class="fas fa-chart-pie mr-1"></i>Ideas por pilar</h3>${snap.pilares.map(p => { const n = ids.filter(i => i.pilar_id === p.id).length, c = col(p.color); return `<div class="flex items-center gap-2 text-sm mb-1"><span class="w-40 truncate ${c.text} font-bold">${esc(p.nombre)}</span><div class="flex-1 h-3 bg-gray-100 rounded"><div class="h-3 rounded ${c.solid}" style="width:${pct(n, Math.max(...snap.pilares.map(q => ids.filter(i => i.pilar_id === q.id).length), 1))}%"></div></div><span class="font-mono w-8 text-right">${n}</span></div>`; }).join('')}<div class="text-xs text-gray-500 mt-2">Top consolidadas por votos: ${gs.slice().sort((a, b) => b.votos - a.votos).slice(0, 3).map(g => esc(g.titulo) + ' (' + g.votos + ')').join(' · ') || '—'}</div></div>
        <div class="bg-white rounded-xl shadow p-4"><h3 class="font-black mb-2"><i class="fas fa-flask mr-1"></i>Práctica</h3><button id="btnDemo" onclick="cargarDemo()" class="w-full bg-fn text-emerald-400 rounded py-2 text-sm font-bold"><i class="fas fa-download mr-1"></i>Cargar demo · 5 participantes y 50 ideas</button><p class="text-[11px] text-gray-500 mt-2">Ideas de práctica sobre el caso, con nombres "Demo ·". Deja la etapa en Ideación. Para borrarlas: Reiniciar tablero.</p></div>
        <div class="bg-white rounded-xl shadow p-4"><h3 class="font-black mb-2 text-red-700"><i class="fas fa-triangle-exclamation mr-1"></i>Zona de riesgo</h3><div class="grid grid-cols-2 gap-2 text-xs"><button onclick="if(confirm('¿Borrar todos los votos?'))op('borrar_votos',{},'Votos borrados')" class="bg-red-50 text-red-700 border border-red-200 rounded py-2">Borrar votos</button><button onclick="if(confirm('¿Borrar todas las calificaciones?'))op('borrar_evaluaciones',{},'Calificaciones borradas')" class="bg-red-50 text-red-700 border border-red-200 rounded py-2">Borrar calificaciones</button><button onclick="if(confirm('¿Deshacer la consolidación? Las ideas quedan.'))op('borrar_grupos',{},'Grupos borrados')" class="bg-red-50 text-red-700 border border-red-200 rounded py-2">Borrar grupos</button><button onclick="if(confirm('⚠️ Esto borra TODO (ideas, votos, calificaciones, participantes). ¿Seguro?')&&confirm('¿De verdad?'))op('borrar_todo',{},'Tablero reiniciado')" class="bg-red-600 text-white rounded py-2 font-bold">Reiniciar tablero</button></div></div></div></div>`;

  if (tmFocus) { const t = $('tmMin'); if (t) { t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch (e) {} } }

  /* IA */
  if (!meceMontado) { meceMontado = true; MeceUI.mount($('tab-ia'), { getSnap: () => snap, pilarId: null, onApplied: cargar }); }

  /* MATRIZ */
  $('tab-matriz').innerHTML = `<div class="bg-white rounded-xl shadow p-4 mb-4 flex flex-wrap gap-4 items-center"><h3 class="font-black">Modo de calificación:</h3><span class="text-[11px] text-gray-500 w-full order-last">Con <b>Proyectar</b> en una fila, el muro muestra esa idea gigante con su promedio en vivo y los celulares vibran y califican solo esa (sirve para una idea huérfana en la tertulia). Cuenta contra el tope de calificaciones.</span><button onclick="op('modo_matriz',{modo:'todas'},'Modo: todas a la vez')" class="px-4 py-2 rounded-lg text-sm font-bold ${s.modo_matriz === 'todas' ? 'bg-blue-600 text-white' : 'bg-gray-100'}">Todas a la vez (cada uno a su ritmo)</button><button onclick="op('modo_matriz',{modo:'proyectada'},'Modo: una proyectada')" class="px-4 py-2 rounded-lg text-sm font-bold ${s.modo_matriz === 'proyectada' ? 'bg-blue-600 text-white' : 'bg-gray-100'}">Una a la vez (Shark Tank: proyectar)</button>${s.proyectada_id ? `<button onclick="quitarProyeccion()" class="text-xs underline text-gray-500">Quitar proyección (vuelve a todas a la vez)</button>` : ''}<span class="text-xs text-gray-500 ml-auto">Escala 1–${escalaMax(s)} · hasta ${maxCalif(s, gs.length)} calificaciones por persona · ${snap.conectados} conectados · se califican las consolidadas y las ideas validadas sin grupo</span></div>
    <div class="bg-white rounded-xl shadow overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-800 text-white text-xs uppercase"><tr><th class="p-3 text-left">Pilar</th><th class="p-3 text-left">Idea consolidada</th><th class="p-3 text-center">Votos</th><th class="p-3 text-center">Calif.</th><th class="p-3 text-center">Esf.</th><th class="p-3 text-center">Imp.</th><th class="p-3 text-left">Cuadrante</th><th class="p-3"></th></tr></thead><tbody>${gs.map(g => { const q = cuadrante(g.esfuerzo_prom, g.impacto_prom, escalaMax(s)); const on = s.proyectada_id === g.id; return `<tr class="border-b ${on ? 'bg-yellow-50' : ''}"><td class="p-3 ${col(g.pilar_color).text} font-bold">${esc(g.pilar_nombre || '')}</td><td class="p-3"><b>${esc(g.titulo || g.texto)}</b><div class="text-xs text-gray-500">${esc(g.descripcion_corta || '')}</div><details class="mt-1" ${abiertos.hijas[g.id] ? 'open' : ''} ontoggle="abiertos.hijas[${g.id}]=this.open"><summary class="cursor-pointer text-[10px] font-mono uppercase text-gray-400">Integra ${g.n_hijas} idea(s) · ver</summary><ul class="pl-3 border-l-2 border-gray-200 mt-1">${ids.filter(i => i.padre_id === g.id).map(i => `<li class="text-xs text-gray-600">${esc(i.texto)} <span class="text-gray-400">· ${esc(i.participante_nombre || '')}</span></li>`).join('')}</ul></details></td><td class="p-3 text-center font-mono">${g.votos}</td><td class="p-3 text-center font-mono">${g.conteo_eval}</td><td class="p-3 text-center font-mono text-purple-700 font-bold">${g.conteo_eval ? g.esfuerzo_prom : '–'}</td><td class="p-3 text-center font-mono text-blue-700 font-bold">${g.conteo_eval ? g.impacto_prom : '–'}</td><td class="p-3 text-xs font-bold text-${q.color}-700">${g.conteo_eval ? q.label : ''}</td><td class="p-3 text-right whitespace-nowrap"><button onclick="proyectarIdea(${g.id})" class="px-3 py-1 rounded text-xs font-bold ${on ? 'bg-yellow-400' : 'bg-gray-100 hover:bg-yellow-300'}"><i class="fas fa-tv mr-1"></i>${on ? 'Proyectando' : 'Proyectar'}</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="p-6 text-center text-gray-400">Aún no hay ideas consolidadas. Genera la consolidación en la pestaña IA · MECE o en la vista de gestión.</td></tr>'}</tbody></table></div>`;

  /* IDEAS (CRUD) */
  const filas = snap.ideas.filter(i => !busq || (i.texto + ' ' + (i.titulo || '') + ' ' + (i.participante_nombre || '') + ' ' + (i.pilar_nombre || '')).toLowerCase().includes(busq)).slice().sort((a, b) => b.id - a.id);
  $('tab-ideas').innerHTML = `<div class="flex flex-wrap gap-2 items-center mb-3"><input id="busq" value="${esc(busq)}" oninput="busq=this.value.toLowerCase();render()" class="flex-1 min-w-[200px] p-2 border rounded" placeholder="Buscar en ideas, títulos, participantes…"><button onclick="abrirModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold"><i class="fas fa-plus mr-1"></i>Crear</button><button onclick="exportarCSV()" class="bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-bold"><i class="fas fa-download mr-1"></i>CSV</button><span class="text-xs text-gray-500">${filas.length} filas</span></div>
    <div class="bg-white rounded-xl shadow overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-800 text-white text-xs uppercase"><tr><th class="p-2">ID</th><th class="p-2 text-left">Tipo</th><th class="p-2 text-left">Pilar</th><th class="p-2 text-left">Texto / Título</th><th class="p-2 text-left">Estado</th><th class="p-2 text-left">Quién</th><th class="p-2"></th></tr></thead><tbody>${filas.map(i => `<tr class="border-b hover:bg-gray-50 ${i.tipo === 'grupo' ? 'bg-purple-50' : ''}"><td class="p-2 font-mono text-xs">#${i.id}</td><td class="p-2 text-xs">${i.tipo === 'grupo' ? '<span class="text-purple-700 font-bold">grupo</span>' : 'idea'}</td><td class="p-2 text-xs ${col(i.pilar_color).text}">${esc(i.pilar_nombre || '')}</td><td class="p-2 text-xs max-w-md">${i.tipo === 'grupo' ? '<b>' + esc(i.titulo) + '</b><div class="text-gray-500">' + esc(i.descripcion_corta || '') + '</div>' : esc(i.texto)}${i.padre_id ? `<div class="text-[10px] text-purple-600">↳ en grupo #${i.padre_id}</div>` : ''}</td><td class="p-2 text-xs">${i.estado}${i.es_editado ? ' <i class="fas fa-pencil text-amber-500" title="editada"></i>' : ''}</td><td class="p-2 text-xs">${esc(i.participante_nombre || '')}</td><td class="p-2 whitespace-nowrap text-right"><button onclick="abrirModal(${i.id})" class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white" title="Editar"><i class="fas fa-pencil"></i></button> <button onclick="if(confirm('¿Eliminar #${i.id}?'))op('eliminar_idea',{id:${i.id}},'Eliminada')" class="w-8 h-8 rounded-full bg-red-100 text-red-700 hover:bg-red-600 hover:text-white" title="Eliminar"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
  if (busq) { const b = $('busq'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }

  /* PILARES */
  if (!(document.activeElement && $('tab-pilares').contains(document.activeElement))) $('tab-pilares').innerHTML = `<div class="grid md:grid-cols-2 gap-4">${snap.pilares.map(p => `<div class="bg-white rounded-xl shadow p-4 border-t-4 ${col(p.color).border}"><div class="grid grid-cols-6 gap-2"><input class="col-span-3 p-2 border rounded font-bold" value="${esc(p.nombre)}" id="pn${p.id}" placeholder="Nombre"><input class="col-span-1 p-2 border rounded text-xs" value="${p.orden}" id="po${p.id}" type="number" placeholder="Orden"><select class="col-span-2 p-2 border rounded bg-white text-xs" id="pc${p.id}">${Object.keys(COLORS).map(c => `<option ${c === p.color ? 'selected' : ''}>${c}</option>`).join('')}</select><input class="col-span-6 p-2 border rounded text-xs" value="${esc(p.icono)}" id="pi${p.id}" placeholder="Icono Font Awesome (fa-bullhorn)"><textarea class="col-span-6 p-2 border rounded text-sm" rows="3" id="pe${p.id}" placeholder="Enunciado / problema guía">${esc(p.enunciado || '')}</textarea><input class="col-span-6 p-2 border rounded text-xs" value="${esc((p.subfrentes || []).join(' | '))}" id="ps${p.id}" placeholder="Subfrentes separados por | (opcional)"></div><div class="flex gap-2 mt-2"><button onclick="guardarPilar(${p.id})" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm font-bold">Guardar</button><button onclick="if(confirm('¿Eliminar el pilar ${esc(p.nombre)}? Sus ideas quedan sin pilar.'))op('eliminar_pilar',{id:${p.id}},'Pilar eliminado')" class="bg-red-100 text-red-700 rounded px-4 text-sm">Eliminar</button></div></div>`).join('')}
    <div class="bg-white rounded-xl shadow p-4 border-2 border-dashed"><h3 class="font-black mb-2">Nuevo pilar</h3><input id="npNombre" class="w-full p-2 border rounded mb-2" placeholder="Nombre"><textarea id="npEnun" class="w-full p-2 border rounded mb-2 text-sm" rows="2" placeholder="Enunciado"></textarea><input id="npSub" class="w-full p-2 border rounded mb-2 text-xs" placeholder="Subfrentes separados por |"><div class="flex gap-2"><select id="npColor" class="p-2 border rounded bg-white text-xs">${Object.keys(COLORS).map(c => `<option>${c}</option>`).join('')}</select><button onclick="nuevoPilar()" class="flex-1 bg-emerald-600 text-white rounded py-2 text-sm font-bold">Crear pilar</button></div></div></div>`;

  /* PARTICIPANTES */
  $('tab-participantes').innerHTML = `<div class="bg-white rounded-xl shadow overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-800 text-white text-xs uppercase"><tr><th class="p-2 text-left">Nombre</th><th class="p-2 text-left">Perfil</th><th class="p-2 text-center">Ideas</th><th class="p-2 text-center">Votos</th><th class="p-2 text-left">Registro</th><th class="p-2 text-left">Última señal</th><th class="p-2"></th></tr></thead><tbody>${parts.map(p => { const vivo = new Date(p.last_seen).getTime() > Date.now() - 90000; return `<tr class="border-b"><td class="p-2 font-bold"><i class="fas fa-circle mr-1 text-[8px] ${vivo ? 'text-emerald-500' : 'text-gray-300'}"></i>${esc(p.nombre)}</td><td class="p-2 text-xs">${esc(p.perfil || '')}</td><td class="p-2 text-center font-mono">${ids.filter(i => i.participante_id === p.id).length}</td><td class="p-2 text-center font-mono">–</td><td class="p-2 text-xs">${fmtHora(p.created_at)}</td><td class="p-2 text-xs">${fmtHora(p.last_seen)}</td><td class="p-2 text-right"><button onclick="eliminarPart('${p.id}')" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button></td></tr>`; }).join('') || '<tr><td colspan="7" class="p-6 text-center text-gray-400">Nadie registrado todavía.</td></tr>'}</tbody></table></div>`;

  /* CONFIG */
  if (!$('cfNombre')) $('tab-config').innerHTML = `<div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-xl shadow p-4 space-y-2"><h3 class="font-black">Sesión</h3><label class="text-xs font-bold">Nombre</label><input id="cfNombre" class="w-full p-2 border rounded" value="${esc(s.nombre)}"><label class="text-xs font-bold">Empresa</label><input id="cfEmpresa" class="w-full p-2 border rounded" value="${esc(s.empresa || '')}"><label class="text-xs font-bold">Facilitador</label><input id="cfFac" class="w-full p-2 border rounded" value="${esc(s.facilitador || '')}"><label class="text-xs font-bold">Caso (contexto que ven los participantes y la IA)</label><textarea id="cfCaso" rows="4" class="w-full p-2 border rounded text-sm">${esc(s.config.caso || '')}</textarea><label class="text-xs font-bold">Restricciones (una por línea)</label><textarea id="cfRestr" rows="4" class="w-full p-2 border rounded text-sm">${esc((s.config.restricciones || []).join('\n'))}</textarea></div>
    <div class="bg-white rounded-xl shadow p-4 space-y-2"><h3 class="font-black">Parámetros</h3><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold">Votos por pilar <span class="font-normal text-gray-400">(solo etapa opcional 4 · votación)</span></label><input id="cfVotos" type="number" class="w-full p-2 border rounded" value="${s.config.votos_por_pilar || 3}"></div><div><label class="text-xs font-bold">Escala máxima matriz (1 a N)</label><input id="cfEscala" type="number" min="2" max="10" class="w-full p-2 border rounded" value="${escalaMax(s)}"></div><div><label class="text-xs font-bold">Calificaciones por participante (matriz)</label><input id="cfMaxCal" type="number" min="1" max="100" class="w-full p-2 border rounded" value="${maxCalif(s)}"></div><div><label class="text-xs font-bold">Minutos ideación</label><input id="cfMinI" type="number" class="w-full p-2 border rounded" value="${s.config.minutos_ideacion || 10}"></div><div><label class="text-xs font-bold">Minutos matriz</label><input id="cfMinM" type="number" class="w-full p-2 border rounded" value="${s.config.minutos_matriz || 8}"></div></div>
      <button onclick="guardarConfig()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg mt-2">Guardar configuración</button>
      <div class="text-xs text-gray-500 mt-4 space-y-1"><div><b>Modo:</b> ${DB.MODE === 'local' ? 'DEMO LOCAL (datos solo en este navegador)' : 'Supabase · ' + esc(FORO_CONFIG.SUPABASE_URL)}</div><div><b>Sesión:</b> ${esc(DB.SES)}</div><div><b>URL participante:</b> <span class="font-mono">${esc(urlVista('index.html'))}</span></div><div>Las claves de admin y líder se cambian en la base (tabla <span class="font-mono">sesiones</span>).</div></div></div></div>`;
}
function setTab(t) { tab = t; sessionStorage.setItem('foro_admin_tab', t); render(); }
async function login() { const clave = $('lgClave').value; try { const r = await DB.admin('login', {}, clave); if (r.rol !== 'admin') return toast('Esa clave es de líder, no de administrador', 'warn'); DB.setClave(clave); sessionStorage.setItem('foro_rol_' + DB.SES, 'admin'); await cargar(); } catch (e) { toast(errMsg(e), 'err'); } }
function logout() { DB.setClave(''); sessionStorage.removeItem('foro_rol_' + DB.SES); location.reload(); }
/* Proyectar una idea: pasa la matriz a modo "una a la vez" (si no lo está), la muestra gigante en el muro y en los celulares solo se califica esa. */
async function proyectarIdea(id) { if (snap.sesion.modo_matriz !== 'proyectada') await DB.admin('modo_matriz', { modo: 'proyectada' }); await op('proyectar', { idea_id: id }, 'Proyectada en el muro y en los celulares'); }
async function quitarProyeccion() { await DB.admin('proyectar', { idea_id: null }); await op('modo_matriz', { modo: 'todas' }, 'Proyección quitada · modo todas a la vez'); }
function eliminarPart(id) { const p = parts.find(x => x.id === id); if (p && confirm('¿Eliminar a ' + p.nombre + '?')) op('eliminar_participante', { id }, 'Eliminado'); }
async function cargarDemo() {
  const nDemo = parts.filter(p => /^Demo · /.test(p.nombre)).length;
  if (!confirm('¿Cargar el ejercicio demo (5 participantes y 50 ideas)?' + (nDemo ? ' Ya hay ' + nDemo + ' participantes demo: se duplicarán.' : ''))) return;
  const b = $('btnDemo'); if (b) { b.disabled = true; b.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i>Cargando…'; }
  try { const r = await DEMO.cargar(snap, (t) => { const x = $('btnDemo'); if (x) x.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i>' + t; }); toast('Demo cargado: ' + r.participantes + ' participantes, ' + r.ideas + ' ideas'); await cargar(); }
  catch (e) { toast(errMsg(e), 'err'); await cargar(); }
}
async function cambiarEtapa(k) { const x = stageInfo(k); const min = x.timer ? Number(snap.sesion.config[x.timer] || 0) : 0; if (k === 'matriz' && snap.sesion.modo_matriz !== 'todas') { await DB.admin('proyectar', { idea_id: null }); await DB.admin('modo_matriz', { modo: 'todas' }); } await op('cambiar_etapa', { etapa: k, minutos: min }, 'Etapa: ' + x.label); }
async function guardarPilar(id) { await op('upsert_pilar', { id, nombre: $('pn' + id).value, orden: Number($('po' + id).value), color: $('pc' + id).value, icono: $('pi' + id).value, enunciado: $('pe' + id).value, subfrentes: $('ps' + id).value.split('|').map(s => s.trim()).filter(Boolean) }, 'Pilar guardado'); }
async function nuevoPilar() { const nombre = $('npNombre').value.trim(); if (!nombre) return toast('Nombre', 'warn'); await op('upsert_pilar', { nombre, enunciado: $('npEnun').value, color: $('npColor').value, orden: snap.pilares.length + 1, subfrentes: $('npSub').value.split('|').map(s => s.trim()).filter(Boolean) }, 'Pilar creado'); }
async function guardarConfig() { await op('config', { nombre: $('cfNombre').value, empresa: $('cfEmpresa').value, facilitador: $('cfFac').value, config: { caso: $('cfCaso').value, restricciones: $('cfRestr').value.split('\n').map(s => s.trim()).filter(Boolean), votos_por_pilar: Number($('cfVotos').value), escala_max: Number($('cfEscala').value), max_calificaciones: Number($('cfMaxCal').value), minutos_ideacion: Number($('cfMinI').value), minutos_matriz: Number($('cfMinM').value) } }, 'Configuración guardada'); }
/* Modal */
function abrirModal(id) {
  $('mPilar').innerHTML = snap.pilares.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('') + '<option value="">Sin pilar</option>';
  const i = id ? snap.ideas.find(x => x.id === id) : null;
  $('mTitle').textContent = i ? 'Editar #' + i.id : 'Crear'; $('mId').value = i ? i.id : ''; $('mTipo').value = i ? i.tipo : 'idea'; $('mTipo').disabled = !!i; $('mPilar').value = i ? (i.pilar_id || '') : snap.pilares[0].id; $('mEstado').value = i ? i.estado : 'validada'; $('mSub').value = i ? (i.subfrente || '') : ''; $('mTexto').value = i ? i.texto : ''; $('mTitulo').value = i ? (i.titulo || '') : ''; $('mCorta').value = i ? (i.descripcion_corta || '') : ''; $('mDetalle').value = i ? (i.detalle || '') : ''; $('mResp').value = i ? (i.responsable || '') : ''; $('mTiempo').value = i ? (i.tiempo_ejecucion || '') : '';
  modalTipo(); $('modal').classList.remove('hidden');
}
function modalTipo() { const g = $('mTipo').value === 'grupo'; $('mTextoBox').style.display = g ? 'none' : 'block'; $('mGrupoBox').style.display = g ? 'grid' : 'grid'; $('mEstadoBox').style.display = g ? 'none' : 'block'; }
function cerrarModal() { $('modal').classList.add('hidden'); }
async function guardarModal() {
  const id = $('mId').value, tipo = $('mTipo').value, pilar_id = $('mPilar').value || null;
  const base = { pilar_id, subfrente: $('mSub').value, titulo: $('mTitulo').value, descripcion_corta: $('mCorta').value, detalle: $('mDetalle').value, responsable: $('mResp').value, tiempo_ejecucion: $('mTiempo').value };
  if (id) { const p = { id: Number(id), ...base }; if (tipo === 'grupo') p.texto = $('mTitulo').value || 'Grupo'; else { p.texto = $('mTexto').value; p.estado = $('mEstado').value; } await op('editar_idea', p, 'Guardado'); }
  else { if (tipo === 'grupo') await op('crear_grupo', { pilar_id, titulo: $('mTitulo').value, descripcion_corta: $('mCorta').value, detalle: $('mDetalle').value, ideas: [] }, 'Grupo creado'); else await op('crear_idea', { pilar_id, subfrente: $('mSub').value, texto: $('mTexto').value, participante_nombre: 'Admin' }, 'Idea creada'); }
  cerrarModal();
}
function exportarCSV() { const rows = [['id', 'tipo', 'pilar', 'subfrente', 'texto', 'titulo', 'descripcion_corta', 'detalle', 'estado', 'padre_id', 'participante', 'votos', 'evaluaciones', 'esfuerzo_prom', 'impacto_prom', 'responsable', 'tiempo', 'creado']]; snap.ideas.forEach(i => rows.push([i.id, i.tipo, i.pilar_nombre, i.subfrente, i.texto, i.titulo, i.descripcion_corta, i.detalle, i.estado, i.padre_id, i.participante_nombre, i.votos, i.conteo_eval, i.esfuerzo_prom, i.impacto_prom, i.responsable, i.tiempo_ejecucion, i.created_at])); const csv = rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'foro_' + DB.SES + '_ideas.csv'; a.click(); }
setInterval(() => { const t = $('tmrA'); if (t && snap) t.textContent = (snap.sesion.fin_etapa || ['ideacion', 'matriz'].includes(snap.sesion.etapa)) ? timerText(snap.sesion) : ''; }, 1000);
Poll.start(cargar, 4000);
</script>
</body>
</html>
