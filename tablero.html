<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="20260929a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freaknerd_ · Tablero de acciones</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<style>
  body{font-family:Montserrat,ui-sans-serif,system-ui,sans-serif}
  .fn-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}.fn-green{color:#26E57C}.bg-fn{background:#0A0B0D}
  .dotgrid{background-image:radial-gradient(rgba(38,229,124,.18) 1px,transparent 1px);background-size:20px 20px}
  [hidden]{display:none !important}
  #qrBox{transition:opacity 180ms ease-out}#qrBox>div{transition:transform 200ms cubic-bezier(.23,1,.32,1)}
  #qrBox.off{opacity:0;pointer-events:none}#qrBox.off>div{transform:scale(.96)}
  @media (prefers-reduced-motion:reduce){#qrBox>div{transition:none}}
  @media print{.no-print{display:none!important}body{background:#fff;color:#111}.card{break-inside:avoid}}
</style>
<script src="js/config.js?v=20260929a"></script><script src="js/db.js?v=20260929a"></script><script src="js/common.js?v=20260929a"></script><script src="js/acciones.js?v=20260929a"></script>
</head>
<body class="bg-fn text-white min-h-screen flex flex-col">
<nav data-nav class="bg-fn text-white p-3 flex justify-between items-center border-b border-emerald-500/30 no-print"></nav>
<div id="errBanner" hidden class="bg-red-600 text-white text-xs text-center py-1"></div>

<header class="px-4 sm:px-8 pt-6 pb-3 flex flex-wrap items-end justify-between gap-4 dotgrid">
  <div class="min-w-0">
    <div id="hSup" class="fn-mono text-[12px] uppercase tracking-[.2em] fn-green">Junta asesora · todas las mesas</div>
    <h1 id="hTit" class="text-3xl sm:text-4xl font-black mt-1">Tablero de acciones</h1>
    <p id="hSub" class="text-gray-300 mt-1 max-w-3xl"></p>
  </div>
  <div class="flex items-end gap-8">
    <div class="text-right"><div id="kTotal" class="text-5xl font-black leading-none tabular-nums">0</div><div class="text-[11px] uppercase tracking-widest text-gray-400 mt-1">acciones</div></div>
    <div class="text-right"><div id="kListas" class="text-5xl font-black leading-none fn-green tabular-nums">0</div><div id="kListasPie" class="text-[11px] uppercase tracking-widest text-gray-400 mt-1">completas</div></div>
  </div>
</header>

<main id="mesas" class="flex-1 px-4 sm:px-8 pb-4 grid gap-5 content-start"></main>

<footer class="px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between gap-3 border-t border-white/10 no-print">
  <div id="vistas" class="flex flex-wrap items-center gap-1 text-xs font-bold"></div>
  <div class="flex items-center gap-2">
    <button onclick="exportar()" class="press bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded text-xs font-bold"><i class="fas fa-file-csv mr-1"></i>CSV para el acta</button>
    <button onclick="window.print()" class="press bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded text-xs font-bold"><i class="fas fa-print mr-1"></i>Imprimir</button>
    <button onclick="toggleQr()" class="press bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded text-xs font-bold"><i class="fas fa-qrcode mr-1"></i>QR</button>
  </div>
</footer>

<div id="qrBox" class="off fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center no-print" onclick="toggleQr()">
  <div class="bg-white p-6 rounded-2xl text-center"><div id="qr"></div><p id="qrTit" class="text-black font-black mt-3"></p></div>
  <p id="qrPie" class="text-gray-300 text-sm mt-4 text-center max-w-sm"></p>
</div>

<script>
/* Tablero proyectado: solo lee y se refresca cada 4 s.
   tablero.html       → todas las mesas (visualizador general del cierre)
   tablero.html?m=xx  → una sola mesa, en grande (para la pantalla de esa mesa) */
let filas = [], slug = mesaDeUrl(), firma = '';
const nuevas = Nuevas();
renderNav('Tablero', '', { app: false });

function columna(m, f, nv, sola) {
  return `<section>
    ${sola ? '' : `<div class="flex items-baseline justify-between border-b border-white/15 pb-2 mb-3">
      <h2 class="text-xl font-black"><i class="fas ${esc(m.icono)} mr-2 fn-green"></i>${esc(m.nombre)}</h2>
      <span class="fn-mono text-xs text-gray-400">${f.length} ${f.length === 1 ? 'acción' : 'acciones'}</span>
    </div>`}
    <div class="${sola ? 'grid lg:grid-cols-2 gap-3' : 'space-y-2'}">${f.length ? f.map((x, i) => tarjetaAccion(x, { oscuro: true, grande: true, num: i + 1, nueva: nv.has(x.id) })).join('') : '<p class="text-gray-400 text-sm py-6 text-center">Esperando a la mesa…</p>'}</div>
  </section>`;
}
function render() {
  const sola = slug && JUNTA.mesas.some(m => m.slug === slug);
  const vis = sola ? filas.filter(f => f.mesa === slug) : filas, nv = nuevas(vis);
  if (sola) {
    const m = mesaInfo(slug);
    $('hSup').textContent = (JUNTA.sesion ? JUNTA.sesion.nombre : 'Junta asesora') + ' · mesa';
    $('hTit').innerHTML = `<i class="fas ${esc(m.icono)} mr-2 fn-green"></i>${esc(m.nombre)}`;
    $('hSub').textContent = [m.pregunta, [m.modera && 'Modera ' + m.modera, m.relata && 'relata ' + m.relata].filter(Boolean).join(' · ')].filter(Boolean).join(' — ');
    $('mesas').style.gridTemplateColumns = '1fr';
    $('mesas').innerHTML = columna(m, vis, nv, true);
  } else {
    $('hSup').textContent = (JUNTA.sesion ? JUNTA.sesion.nombre : 'Junta asesora') + ' · todas las mesas';
    $('hTit').textContent = 'Tablero de acciones'; $('hSub').textContent = '';
    const conocidas = new Set(JUNTA.mesas.map(m => m.slug)), huerfanas = filas.filter(f => !conocidas.has(f.mesa));
    const cols = [...JUNTA.mesas.map(m => [m, filas.filter(f => f.mesa === m.slug)]), ...(huerfanas.length ? [[{ nombre: 'Otras', icono: 'fa-inbox' }, huerfanas]] : [])];
    $('mesas').style.gridTemplateColumns = `repeat(${Math.min(cols.length, 3)}, minmax(0,1fr))`;
    $('mesas').innerHTML = cols.map(([m, f]) => columna(m, f, nv, false)).join('');
  }
  $('kTotal').textContent = vis.length;
  $('kListas').textContent = vis.filter(f => JUNTA.completa(f)).length;
  $('kListasPie').textContent = 'completas';
  $('kListasPie').title = 'Con todos los campos obligatorios: ' + JUNTA.campos.filter(c => c.obligatorio).map(c => c.etiqueta.toLowerCase()).join(', ');
  const chip = (href, txt, on) => `<a href="${href}" class="px-2.5 py-1 rounded ${on ? 'bg-emerald-400 text-black' : 'bg-white/10 hover:bg-white/20'}">${esc(txt)}</a>`;
  $('vistas').innerHTML = chip(urlVista('tablero.html'), 'General', !sola) + JUNTA.mesas.map(m => chip(urlMesa('tablero.html', m.slug), m.nombre, slug === m.slug)).join('');
  qrHecho = '';
}
async function refrescar() {
  const [ses, acc] = await Promise.all([DB.getSesion(), DB.getAcciones()]);
  const f = JSON.stringify([ses && ses.config && ses.config.junta, ses && ses.nombre, acc]);
  if (f === firma) return;
  firma = f; JUNTA.leer(ses); filas = acc; render();
}
function exportar() {
  const sola = slug && JUNTA.mesas.some(m => m.slug === slug), vis = sola ? filas.filter(f => f.mesa === slug) : filas;
  if (!vis.length) return toast('El tablero está vacío', 'warn');
  descargarCsv(nombreArchivo(sola ? slug : ''), accionesCsv(vis));
}
/* QR: en una mesa lleva a la vista de miembros de esa mesa; en el general, al selector de mesas */
let qrHecho = '';
function toggleQr() {
  const box = $('qrBox'), abrir = box.classList.contains('off');
  box.classList.toggle('off', !abrir);
  if (!abrir) return;
  const sola = slug && JUNTA.mesas.some(m => m.slug === slug), url = sola ? urlMesa('mesa.html', slug) : urlVista('mesa.html');
  if (qrHecho !== url) { $('qr').innerHTML = ''; new QRCode($('qr'), { text: url, width: 240, height: 240 }); qrHecho = url; }
  $('qrTit').textContent = sola ? mesaInfo(slug).nombre : 'Mesas de la junta';
  $('qrPie').textContent = sola ? 'Los miembros escanean para ver y descargar las acciones de esta mesa' : 'Cada miembro escanea, elige su mesa y descarga sus acciones';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('qrBox').classList.contains('off')) toggleQr(); });
Poll.start(refrescar, 4000); DB.onAccionesChange && DB.onAccionesChange(refrescar);
</script>
</body>
</html>
