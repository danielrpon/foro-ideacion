  <h1 id="titulo" class="text-[32px] leading-[44px] font-black"></h1>
  <div class="flex items-center gap-6"><span id="conectados" class="fn-mono text-[12px] uppercase tracking-[.14em] text-fn-texto2"><i class="fas fa-users mr-1"></i>0 conectados</span><span id="tmr" class="fn-mono text-[32px] leading-[44px] font-medium text-fn-azul"></span></div>
</div>

<script>
let snap = null, viewKey = '', chart = null; const abiertos = new Set(JSON.parse(localStorage.getItem('muro_abiertos') || '[]')); let todosAbiertos = localStorage.getItem('muro_todos') === '1';
function toggleAb(id, open) { open ? abiertos.add(id) : abiertos.delete(id); localStorage.setItem('muro_abiertos', JSON.stringify([...abiertos])); }
function toggleTodos() { todosAbiertos = !todosAbiertos; localStorage.setItem('muro_todos', todosAbiertos ? '1' : '0'); viewKey = ''; render(); }
function hijasHtml(g, cls = 'text-sm') { const h = snap.ideas.filter(i => i.tipo === 'idea' && i.padre_id === g.id); if (!h.length) return ''; const op = (todosAbiertos || abiertos.has(g.id)) ? 'open' : ''; return `<details ${op} ontoggle="toggleAb(${g.id}, this.open)" class="mt-2"><summary class="cursor-pointer text-[11px] font-mono uppercase text-gray-500 hover:text-gray-800 select-none"><i class="fas fa-caret-right mr-1"></i>Integra ${h.length} idea(s) · ver</summary><ul class="mt-1 pl-3 border-l-2 border-gray-200 space-y-1">${h.map(i => `<li class="${cls} text-gray-700">${esc(i.texto)}</li>`).join('')}</ul></details>`; }
renderNav('muro', '', { app: false });
async function cargar() { snap = await DB.snapshot(); if (saltarAJunta(snap.sesion, 'tablero.html')) return; setNavEtapa(snap.sesion); render(); }
setInterval(() => { if (snap) { const t = $('tmr'); const s = snap.sesion; t.textContent = (s.fin_etapa || ['ideacion', 'matriz'].includes(s.etapa)) ? timerText(s) : ''; const tp = $('tmrPausa'); if (tp) tp.textContent = timerText(s); t.className = 'font-mono text-3xl font-black ' + (timerVencido(s) ? 'text-red-500 animate-pulse' : 'text-emerald-400'); } }, 1000);

const grupos = () => calificables(snap.ideas);
const ideasOK = () => snap.ideas.filter(i => i.tipo === 'idea' && i.estado !== 'repetida');
const nParts = () => Math.max(snap.conectados, 1);

function instr(titulo, pasos, icono = 'fa-circle-info') {
  return `<div class="h-full flex items-center justify-center fade-in"><div class="bg-white rounded-2xl shadow-xl p-12 max-w-4xl w-full"><div class="flex items-center gap-4 mb-6"><i class="fas ${icono} text-5xl text-blue-500"></i><h2 class="text-4xl font-black">${titulo}</h2></div><ol class="space-y-3 text-2xl list-decimal pl-8">${pasos.map(p => `<li>${p}</li>`).join('')}</ol></div></div>`;
}

/* Portada a sangre: en bienvenida toda la pantalla es oscura (sin franja gris ni tarjeta flotante) */
function modoPortada(on) { const a = $('app'); a.classList.toggle('p-6', !on); a.classList.toggle('p-0', on); }
function render() {
  const s = snap.sesion, et = s.etapa, app = $('app'), gs = grupos();
  modoPortada(et === 'bienvenida');
  $('titulo').textContent = stageInfo(et).label;
  $('conectados').innerHTML = `<i class="fas fa-users mr-1"></i>${snap.conectados} conectados`;
  const c2 = $('cnt2'); if (c2) c2.textContent = snap.conectados;
  const key = et + '|' + todosAbiertos + '|' + snap.ideas.length + '|' + gs.map(g => g.id + ':' + g.votos + ':' + g.conteo_eval + ':' + g.esfuerzo_prom + ':' + g.impacto_prom).join(',') + '|' + s.proyectada_id + '|' + s.modo_matriz + '|' + snap.ideas.map(i => i.id + i.estado + i.padre_id + i.updated_at).join('|');
  if (key === viewKey) return; viewKey = key;

  if (et === 'bienvenida') {
    const m = marca(s);
    const portada = (logo, kicker, titulo, caso, pie) => { app.innerHTML = `<div class="h-full relative fade-in overflow-hidden"><div class="absolute inset-y-0 right-0 w-[46%] hidden md:block"><canvas class="fn-campo" data-campo="h" data-seed="7"></canvas></div><div class="absolute inset-x-0 bottom-0 h-[132px] md:hidden"><canvas class="fn-campo" data-campo="v" data-seed="7"></canvas></div><div class="absolute left-[22px] right-[22px] top-[22px] bottom-[154px] md:left-[88px] md:right-auto md:top-[66px] md:bottom-[66px] md:w-[52%] flex flex-col justify-start md:justify-center overflow-hidden">${logo}<p class="fn-mono text-[11px] md:text-[12px] uppercase tracking-[.14em] text-fn-texto2 mt-[22px] md:mt-[44px] leading-[22px]">${kicker}</p><h2 class="text-[40px] leading-[44px] md:text-[76px] md:leading-[88px] font-black mt-[11px]" style="letter-spacing:-.035em">${titulo}</h2><p class="text-[14px] leading-[22px] md:text-[18px] md:leading-[33px] text-fn-texto2 mt-[22px] md:max-w-[594px] text-pretty">${caso}</p><p class="mt-[22px] md:mt-[44px] fn-mono text-[11px] uppercase tracking-[.14em] text-fn-nota leading-[22px]">${pie}</p></div><div class="absolute right-[88px] bottom-[22px] w-[40%] fn-leyenda hidden md:flex"><span>← Así llega</span><span>Así queda →</span></div></div>`; };
    if (m) { portada(`<img src="${esc(m.logo_claro || m.logo)}" alt="${esc(m.nombre)}" class="h-24 w-auto self-start">`, esc(tituloEvento(s)), esc(s.empresa || s.nombre), esc(s.config.caso || ''), `Bienvenidos · en un momento arrancamos · ${facilitadoPor()}`); return; }
    portada(wordmark('text-[44px] self-start') + (logoEmpresa(s) ? `<img src="${esc(logoEmpresa(s))}" class="logo-azul h-12 w-auto mt-[22px] self-start" onerror="this.style.display='none'">` : ''), esc(s.config.titulo_evento || 'Foro de ideación'), esc(s.empresa || s.nombre), esc(s.config.caso || ''), 'Bienvenidos · en un momento arrancamos'); return;
  }
  if (et === 'instrucciones') {
    app.innerHTML = `<div class="h-full grid grid-cols-2 gap-10 items-center"><div class="bg-white rounded-2xl shadow-xl p-10 flex flex-col items-center"><div id="qr"></div><p class="mt-4 font-mono text-lg text-gray-600 break-all text-center" id="qrUrl"></p></div>
      <div><h2 class="text-5xl font-black mb-8">Conéctate desde tu celular</h2><ol class="space-y-5 text-2xl list-decimal pl-8"><li>Conéctate al Wi-Fi de la sala (o usa datos).</li><li>Escanea el QR con la cámara.</li><li>Escribe tu nombre y tu perfil.</li><li>Deja la pantalla abierta: te lleva sola a cada etapa.</li></ol><div class="mt-10 text-3xl font-black text-blue-700"><i class="fas fa-users mr-2"></i><span id="cnt2">${snap.conectados}</span> conectados</div></div></div>`;
    const url = urlVista('index.html'); $('qrUrl').textContent = url.replace(/^https?:\/\//, ''); new QRCode($('qr'), { text: url, width: 380, height: 380 }); return;
  }
  if (et === 'ideacion') {
    const ideas = ideasOK();
    app.innerHTML = `<div class="cols" style="grid-template-columns:repeat(${snap.pilares.length},1fr)">${snap.pilares.map(p => { const c = col(p.color), mias = ideas.filter(i => i.pilar_id === p.id); return `<div class="colwrap bg-white rounded-xl shadow border-t-8 ${c.border}"><div class="p-3 flex justify-between items-center border-b"><h3 class="font-black text-lg ${c.text}"><i class="fas ${p.icono} mr-1"></i>${esc(p.nombre)}</h3><span class="${c.solid} text-white font-mono font-bold px-3 py-1 rounded-full text-sm">${mias.length}</span></div><div class="colbody p-3 space-y-2">${mias.slice().reverse().map(i => `<div class="postit p-2.5 rounded-lg ${c.postit} border ${c.border} text-sm">${i.subfrente ? `<span class="text-[10px] font-mono uppercase ${c.text}">${esc(i.subfrente)}</span><br>` : ''}${esc(i.texto)}</div>`).join('')}</div></div>`; }).join('')}</div>`; return;
  }
  if (et === 'instrucciones_consolidacion') { app.innerHTML = instr('Consolidación MECE', ['Cerramos la ideación: gracias por las ideas.', 'La IA agrupa las ideas similares sin perder ninguna: cada idea queda en un solo grupo.', 'Luego cada uno califica las consolidadas en esfuerzo e impacto.', 'Mientras tanto: cafecito ☕'], 'fa-wand-magic-sparkles'); return; }
  if (et === 'consolidacion') {
    const ideas = ideasOK(), agrup = ideas.filter(i => i.estado === 'agrupada').length;
    if (!gs.length) { app.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center"><i class="fas fa-wand-magic-sparkles text-7xl text-fn-medio mb-6 animate-pulse"></i><h2 class="text-5xl font-black">La IA está consolidando…</h2><p class="text-2xl text-gray-500 mt-4">${ideas.length} ideas del foro · criterio MECE</p></div>`; return; }
    app.innerHTML = `<div class="flex justify-between items-end mb-3"><h2 class="text-2xl font-black">Ideas consolidadas <span class="text-gray-400 font-normal text-lg">· ${gs.length} consolidadas a partir de ${ideas.length} ideas (${pct(agrup, ideas.length)}% cubiertas)</span></h2><button onclick="toggleTodos()" class="text-xs font-bold px-3 py-1.5 rounded-full border ${todosAbiertos ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}"><i class="fas fa-list-ul mr-1"></i>${todosAbiertos ? 'Ocultar ideas originales' : 'Mostrar ideas originales'}</button></div>
      <div class="cols" style="grid-template-columns:repeat(${snap.pilares.length},1fr);height:calc(100% - 44px)">${snap.pilares.map(p => { const c = col(p.color), mios = gs.filter(g => g.pilar_id === p.id); return `<div class="colwrap bg-white rounded-xl shadow border-t-8 ${c.border}"><div class="p-3 border-b flex justify-between"><h3 class="font-black ${c.text}">${esc(p.nombre)}</h3><span class="text-sm text-gray-400">${mios.length}</span></div><div class="colbody p-3 space-y-2">${mios.map(g => `<div class="p-3 rounded-lg border ${c.border} ${c.bg}"><div class="font-bold text-base leading-snug">${esc(g.titulo || g.texto)}</div><p class="text-sm text-gray-700 mt-1">${esc(g.descripcion_corta || '')}</p>${hijasHtml(g, 'text-xs')}</div>`).join('')}</div></div>`; }).join('')}</div>`; return;
  }
  if (et === 'pausa') { app.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center"><i class="fas fa-mug-hot text-8xl text-fn-azul mb-6"></i><h2 class="text-6xl font-black">Pausa · cafecito</h2>${s.fin_etapa ? `<div id="tmrPausa" class="fn-mono text-8xl font-black text-fn-azul mt-6">${timerText(s)}</div><p class="text-2xl text-gray-500 mt-4">Volvemos con las ideas consolidadas.</p>` : `<p class="text-2xl text-gray-500 mt-4">Volvemos en unos minutos con las ideas consolidadas.</p>`}</div>`; return; }
  if (et === 'resumen') { renderResumen(); return; }
  if (et === 'instrucciones_votacion') { app.innerHTML = instr('Votación', [`Cada uno tiene <b>${s.config.votos_por_pilar || 3} votos por pilar</b>.`, 'Vota las ideas consolidadas que más valgan la pena discutir.', 'Puedes quitar un voto y moverlo mientras la etapa esté abierta.'], 'fa-check-to-slot'); return; }
  if (et === 'votacion' || et === 'resultados') {
    const tot = gs.reduce((a, g) => a + g.votos, 0);
    if (et === 'resultados') {
      const top = gs.slice().sort((a, b) => b.votos - a.votos).slice(0, 10), mx = Math.max(...top.map(g => g.votos), 1);
      app.innerHTML = `<div class="bg-white rounded-xl shadow p-8 h-full overflow-y-auto"><h2 class="text-3xl font-black mb-6">Top ideas por votos <span class="text-lg text-gray-400 font-normal">· ${tot} votos</span></h2><div class="space-y-3">${top.map((g, k) => { const c = col(g.pilar_color); return `<div class="flex items-center gap-4"><div class="w-8 text-right font-mono font-bold text-gray-400">${k + 1}</div><div class="flex-1"><div class="flex justify-between"><span class="font-bold">${esc(g.titulo || g.texto)}</span><span class="font-mono font-bold ${c.text}">${g.votos}</span></div><div class="h-4 bg-gray-100 rounded mt-1"><div class="h-4 rounded ${c.solid}" style="width:${pct(g.votos, mx)}%"></div></div></div></div>`; }).join('')}</div></div>`; return;
    }
    app.innerHTML = `<div class="cols" style="grid-template-columns:repeat(${snap.pilares.length},1fr)">${snap.pilares.map(p => { const c = col(p.color), mios = gs.filter(g => g.pilar_id === p.id); return `<div class="colwrap bg-white rounded-xl shadow border-t-8 ${c.border}"><div class="p-3 border-b"><h3 class="font-black ${c.text}">${esc(p.nombre)}</h3></div><div class="colbody p-3 space-y-2">${mios.map(g => `<div class="p-3 rounded-lg border ${c.border} ${c.bg}"><div class="flex justify-between items-start gap-2"><div class="font-bold">${esc(g.titulo || g.texto)}</div><span class="${c.solid} text-white font-mono font-bold px-2 rounded">${g.votos}</span></div><p class="text-sm text-gray-700 mt-1">${esc(g.descripcion_corta || '')}</p></div>`).join('')}</div></div>`; }).join('')}</div>`; return;
  }
  if (et === 'instrucciones_matriz') { const mx = escalaMax(s); app.innerHTML = instr('Matriz esfuerzo · impacto', [`Cada uno tiene hasta <b>${maxCalif(s, gs.length)} calificaciones</b> para ${gs.length} ideas: úsalas en las ideas donde tengas criterio y deja pasar las demás.`, `Cada calificación va de <b>1 a ${mx}</b> en <b>esfuerzo</b> (plata, tiempo, gente) y en <b>impacto</b> (ventas y caja en 3–6 meses).`, 'Califica desde tu celular tocando un número por criterio. Cada persona ve las ideas en un orden distinto, para que ninguna gane por salir primero.', 'El punto se ubica en el promedio del foro y su tamaño muestra cuántos la calificaron.', 'Buscamos los <b>quick wins</b>: alto impacto, bajo esfuerzo.'], 'fa-chart-line'); return; }
  if (et === 'matriz') {
    if (s.modo_matriz === 'proyectada') {
      const g = gs.find(x => x.id === s.proyectada_id);
      if (!g) { app.innerHTML = `<div class="h-full flex items-center justify-center text-4xl text-gray-400 font-bold">El moderador va a proyectar una idea…</div>`; return; }
      const c = col(g.pilar_color);
      app.innerHTML = `<div class="h-full flex items-center justify-center"><div class="bg-white rounded-2xl shadow-xl p-12 max-w-5xl w-full border-t-8 ${c.border}"><div class="font-mono uppercase ${c.text}">${esc(g.pilar_nombre || '')}</div><h2 class="text-5xl font-black mt-2">${esc(g.titulo || g.texto)}</h2><p class="text-2xl text-gray-600 mt-4">${esc(g.descripcion_corta || '')}</p><p class="text-lg text-gray-500 mt-3">${esc(g.detalle || '')}</p>${hijasHtml(g, 'text-base')}
        <div class="grid grid-cols-3 gap-6 mt-10 text-center"><div class="bg-purple-50 rounded-xl p-5"><div class="text-5xl font-black text-purple-700">${g.conteo_eval ? g.esfuerzo_prom : '–'}</div><div class="text-sm uppercase font-mono text-purple-700">Esfuerzo</div></div><div class="bg-blue-50 rounded-xl p-5"><div class="text-5xl font-black text-blue-700">${g.conteo_eval ? g.impacto_prom : '–'}</div><div class="text-sm uppercase font-mono text-blue-700">Impacto</div></div><div class="bg-gray-50 rounded-xl p-5"><div class="text-5xl font-black">${g.conteo_eval}<span class="text-2xl text-gray-400">/${nParts()}</span></div><div class="text-sm uppercase font-mono text-gray-500">Calificaciones</div></div></div></div></div>`; return;
    }
    app.innerHTML = `<div class="bg-white rounded-xl shadow p-6 h-full overflow-y-auto"><h2 class="text-2xl font-black mb-4">Califica en tu celular <span class="text-gray-400 font-normal text-lg">· ${gs.length} ideas consolidadas · hasta ${maxCalif(s, gs.length)} calificaciones por persona · ${snap.conectados} conectados</span></h2>
      <div class="grid grid-cols-2 gap-3">${gs.map(g => { const c = col(g.pilar_color); return `<div class="p-3 rounded-lg border ${c.border} flex items-start gap-3"><div class="flex-1"><div class="text-[10px] font-mono uppercase ${c.text}">${esc(g.pilar_nombre || '')}</div><div class="font-bold">${esc(g.titulo || g.texto)}</div><div class="text-xs text-gray-500">${esc(g.descripcion_corta || '')}</div>${hijasHtml(g, 'text-xs')}</div><div class="text-right"><div class="font-mono text-sm"><span class="text-purple-700">E ${g.conteo_eval ? g.esfuerzo_prom : '–'}</span> · <span class="text-blue-700">I ${g.conteo_eval ? g.impacto_prom : '–'}</span></div><div class="h-2 w-28 bg-gray-100 rounded mt-1"><div class="h-2 rounded bg-emerald-500" style="width:${Math.min(100, pct(g.conteo_eval, nParts()))}%"></div></div><div class="text-[10px] text-gray-400">${g.conteo_eval}/${nParts()} calificaron</div></div></div>`; }).join('')}</div></div>`; return;
  }
  if (et === 'cierre' || et === 'reporte') {
    const max = escalaMax(s), ev = gs.filter(g => g.conteo_eval > 0);
    const qw = ev.filter(g => cuadrante(g.esfuerzo_prom, g.impacto_prom, max).key === 'quick').sort((a, b) => b.impacto_prom - a.impacto_prom);
    const pr = ev.filter(g => cuadrante(g.esfuerzo_prom, g.impacto_prom, max).key === 'proyecto').sort((a, b) => b.impacto_prom - a.impacto_prom);
    const ds = ev.filter(g => !['quick', 'proyecto'].includes(cuadrante(g.esfuerzo_prom, g.impacto_prom, max).key));
    if (et === 'reporte') { app.innerHTML = `<div class="bg-white rounded-xl shadow p-8 h-full overflow-y-auto"><div class="flex justify-between items-center mb-4"><h2 class="text-3xl font-black">Reporte consolidado</h2><a href="${urlVista('reporte.html')}" target="_blank" class="bg-gray-800 text-white px-4 py-2 rounded"><i class="fas fa-print mr-2"></i>Abrir reporte imprimible</a></div><table class="w-full text-sm"><thead class="text-xs uppercase bg-gray-800 text-white"><tr><th class="p-3 text-left">Pilar</th><th class="p-3 text-left">Idea consolidada</th><th class="p-3 text-center">Imp.</th><th class="p-3 text-center">Esf.</th><th class="p-3 text-left">Cuadrante</th><th class="p-3 text-left">Responsable</th><th class="p-3 text-left">Tiempo</th></tr></thead><tbody>${[...qw, ...pr, ...ds].map(g => { const q = cuadrante(g.esfuerzo_prom, g.impacto_prom, max); return `<tr class="border-b"><td class="p-3">${esc(g.pilar_nombre || '')}</td><td class="p-3 font-bold">${esc(g.titulo || g.texto)}</td><td class="p-3 text-center font-mono text-blue-700 font-bold">${g.impacto_prom}</td><td class="p-3 text-center font-mono text-purple-700 font-bold">${g.esfuerzo_prom}</td><td class="p-3"><span class="text-xs font-bold text-${q.color}-700">${q.label}</span></td><td class="p-3">${esc(g.responsable || '')}</td><td class="p-3">${esc(g.tiempo_ejecucion || '')}</td></tr>`; }).join('')}</tbody></table></div>`; return; }
    /* Numeración por prioridad: impacto menos esfuerzo, luego impacto, luego nº de calificaciones */
    const nmax = Math.max(...ev.map(g => g.conteo_eval), 1); PT = {}; ev.forEach(g => PT[g.id] = puntaje(g, nmax));
    const rank = ev.slice().sort((a, b) => (PT[b.id] - PT[a.id]) || (b.impacto_prom - a.impacto_prom) || (b.conteo_eval - a.conteo_eval));
    NUM = {}; rank.forEach((g, i) => NUM[g.id] = i + 1);
    const porPrioridad = (a, b) => NUM[a.id] - NUM[b.id]; qw.sort(porPrioridad); pr.sort(porPrioridad); ds.sort(porPrioridad);
    const item = (g) => { const c = col(g.pilar_color); return `<li class="flex items-start gap-2 cursor-pointer rounded px-1 -mx-1 hover:bg-white/70" onmouseenter="mostrarDetalle(${g.id})" onclick="fijarDetalle(${g.id})"><span class="shrink-0 w-7 h-7 ${c.solid} text-white font-black text-sm flex items-center justify-center">${NUM[g.id]}</span><span class="flex-1 leading-tight"><b>${esc(g.titulo || g.texto)}</b> <span class="text-xs font-mono text-gray-500 whitespace-nowrap">P ${PT[g.id]} · I ${g.impacto_prom} · E ${g.esfuerzo_prom} · ${g.conteo_eval} calif.</span></span></li>`; };
    app.innerHTML = `<div class="h-full grid gap-4" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)"><div class="bg-white rounded-xl shadow p-4 flex flex-col min-h-0 min-w-0"><h2 class="text-xl font-black mb-1">Matriz esfuerzo · impacto <span class="text-sm font-normal text-gray-400">· tamaño = cuántos la calificaron · número = prioridad (impacto − esfuerzo, ponderado por cuánta gente calificó)</span></h2><div class="flex-1 min-h-0 relative"><canvas id="chart"></canvas></div></div>
      <div class="flex flex-col gap-3 min-h-0 overflow-y-auto">
      <div id="detalle" class="shrink-0 bg-white border border-fn-azul rounded-xl p-5 min-h-[110px]"><p class="text-sm text-gray-400"><i class="fas fa-hand-pointer mr-1"></i>Pasa el mouse o haz clic sobre un punto o un título para ver la idea completa.</p></div>
      <div class="shrink-0 bg-white border border-fn-tinte rounded-xl p-4"><h3 class="font-black text-lg">Hacer ya (${qw.length})</h3><ul class="mt-3 space-y-2">${qw.map(item).join('') || '<li class="text-sm text-gray-400">Ninguna todavía</li>'}</ul></div>
      <div class="shrink-0 bg-white border border-fn-tinte rounded-xl p-4"><h3 class="font-black text-lg">Planear (${pr.length})</h3><ul class="mt-3 space-y-2 text-sm">${pr.map(item).join('') || '<li class="text-gray-400">Ninguno</li>'}</ul></div>
      <div class="shrink-0 bg-white border border-fn-tinte rounded-xl p-4"><h3 class="font-black text-sm">Tareas menores y postergar (${ds.length})</h3><ul class="mt-3 space-y-2 text-xs">${ds.map(item).join('') || '<li class="text-gray-400">—</li>'}</ul></div></div></div>`;
    dibujarChart(ev, max); if (fijado && ev.some(g => g.id === fijado)) mostrarDetalle(fijado); return;
  }
  app.innerHTML = `<div class="h-full flex items-center justify-center text-3xl text-gray-400">${esc(stageInfo(et).label)}</div>`;
}

/* Resumen del foro (etapa 7.5): métricas para proyectar al cierre */
async function renderResumen() {
  const app = $('app'); app.innerHTML = '<div class="h-full flex items-center justify-center text-3xl text-gray-400">Calculando el resumen…</div>';
  let participantes = [], evaluaciones = []; try { participantes = await DB.getParticipantes(); } catch (e) {} try { evaluaciones = await DB.getAllEvaluaciones(); } catch (e) {}
  const r = resumenForo({ sesion: snap.sesion, pilares: snap.pilares, ideas: snap.ideas, participantes, evaluaciones });
  const kpi = (n, l, sub = '') => `<div class="bg-white rounded-xl shadow p-5 text-center"><div class="text-6xl font-black leading-none">${n}</div><div class="font-mono text-xs uppercase tracking-widest text-gray-500 mt-3">${l}</div>${sub ? `<div class="text-sm text-gray-400 mt-1">${sub}</div>` : ''}</div>`;
  const mxP = Math.max(...r.porPilar.map(p => p.ideas), 1);
  app.innerHTML = `<div class="h-full flex flex-col gap-4 min-h-0">
    <div class="grid grid-cols-5 gap-4">${kpi(r.participantes, 'participantes')}${kpi(r.ideas, 'ideas', r.promIdeas + ' por persona')}${kpi(r.ideas + ' → ' + r.consolidadas, 'originales → consolidadas', r.ratio ? r.ratio + ' ideas por consolidada' : '')}${kpi(r.calificaciones, 'calificaciones', r.promCalif + ' por persona · ' + r.conCuatro + ' ideas con 4 o más')}${kpi(r.duracion ? fmtDur(r.duracion) : '–', 'duración', (r.inicio ? fmtHora(new Date(r.inicio).toISOString()) : '') + (r.fin ? ' → ' + fmtHora(new Date(r.fin).toISOString()) : ''))}</div>
    <div class="grid grid-cols-2 gap-4 flex-1 min-h-0">
      <div class="bg-white rounded-xl shadow p-6 min-h-0 overflow-y-auto"><h3 class="font-black text-lg mb-1">Ideas por pilar</h3><p class="text-xs text-gray-400 mb-4">Porcentaje de las ${r.ideas} ideas originales · a la derecha, cuántas consolidadas salieron</p>${r.porPilar.map(p => { const c = col(p.color), pc = pct(p.ideas, r.ideas); return `<div class="mb-4"><div class="flex justify-between items-baseline"><span class="font-bold text-lg ${c.text}">${esc(p.nombre)}</span><span class="font-mono"><b class="text-2xl">${pc}%</b> <span class="text-gray-400 text-sm">· ${p.consolidadas} consolidada${p.consolidadas === 1 ? '' : 's'}</span></span></div><div class="h-4 bg-gray-100 rounded mt-1"><div class="h-4 rounded ${c.solid}" style="width:${pc}%"></div></div></div>`; }).join('')}</div>
      <div class="flex flex-col gap-4 min-h-0"><div class="bg-white rounded-xl shadow p-5"><h3 class="font-black text-lg mb-3">Matriz</h3><div class="grid grid-cols-2 gap-2 text-center"><div class="bg-emerald-50 rounded-lg p-3"><div class="text-3xl font-black text-emerald-700">${r.cuad.quick}</div><div class="text-[10px] font-mono uppercase text-emerald-700">quick wins</div></div><div class="bg-blue-50 rounded-lg p-3"><div class="text-3xl font-black text-blue-700">${r.cuad.proyecto}</div><div class="text-[10px] font-mono uppercase text-blue-700">proyectos</div></div><div class="bg-amber-50 rounded-lg p-3"><div class="text-3xl font-black text-amber-700">${r.cuad.relleno}</div><div class="text-[10px] font-mono uppercase text-amber-700">tareas menores</div></div><div class="bg-gray-100 rounded-lg p-3"><div class="text-3xl font-black text-gray-600">${r.cuad.descartar}</div><div class="text-[10px] font-mono uppercase text-gray-600">postergar</div></div></div></div>
        <div class="bg-white rounded-xl shadow p-5 flex-1"><h3 class="font-black text-lg mb-3">Top 3 por puntaje</h3>${r.top.map((g, i) => `<div class="flex items-start gap-3 mb-3"><span class="shrink-0 w-8 h-8 bg-fn-azul text-white font-black flex items-center justify-center">${i + 1}</span><div><div class="font-bold leading-tight">${esc(g.titulo || g.texto)}</div><div class="font-mono text-xs text-fn-nota mt-1">P ${puntaje(g, r.nmax)} · I ${g.impacto_prom} · E ${g.esfuerzo_prom} · ${g.conteo_eval} calif.</div></div></div>`).join('') || '<p class="text-gray-400 text-sm">Aún sin calificaciones</p>'}</div></div>
    </div></div>`;
}

/* Detalle de una idea (tarjeta lateral): al pasar el mouse se muestra; con clic se fija */
let NUM = {}, PT = {}, fijado = null;
function mostrarDetalle(id) {
  const g = snap.ideas.find(x => x.id === id); const box = $('detalle'); if (!g || !box) return; const c = col(g.pilar_color), q = cuadrante(g.esfuerzo_prom, g.impacto_prom, escalaMax(snap.sesion));
  box.innerHTML = `<div class="flex items-start gap-3"><span class="shrink-0 w-10 h-10 ${c.solid} text-white font-black text-lg flex items-center justify-center">${NUM[g.id] || ''}</span><div class="min-w-0 flex-1"><div class="text-[10px] font-mono uppercase ${c.text}">${esc(g.pilar_nombre || '')} · ${q.label}${fijado === g.id ? ' · <span class="text-gray-400">fijada (clic para soltar)</span>' : ''}</div><div class="font-black text-lg leading-tight">${esc(g.titulo || g.texto)}</div><p class="text-sm text-gray-700 mt-1">${esc(g.descripcion_corta || '')}</p>${g.detalle ? `<p class="text-xs text-gray-500 mt-1">${esc(g.detalle)}</p>` : ''}<div class="font-mono text-xs mt-2"><b>Puntaje ${PT[g.id] ?? ''}</b> · <span class="text-blue-700">Impacto ${g.impacto_prom}</span> · <span class="text-purple-700">Esfuerzo ${g.esfuerzo_prom}</span> · ${g.conteo_eval} calificaciones</div></div></div>`;
}
function fijarDetalle(id) { fijado = (fijado === id) ? null : id; mostrarDetalle(id); }

function dibujarChart(ev, max) {
  const ctx = $('chart'); if (!ctx) return; if (chart) { chart.destroy(); chart = null; }
  const mid = max / 2 + 0.5;
  /* Puntos que comparten promedio se abren en abanico para que ninguno tape a otro */
  const grupos = {}; ev.forEach(g => { const k = g.esfuerzo_prom + ',' + g.impacto_prom; (grupos[k] = grupos[k] || []).push(g); });
  const puntos = []; Object.values(grupos).forEach(arr => { const k = arr.length, r = k === 1 ? 0 : (k <= 4 ? 0.16 : 0.24); arr.forEach((g, i) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / k; puntos.push({ x: g.esfuerzo_prom + r * Math.cos(ang), y: g.impacto_prom + r * Math.sin(ang), g }); }); });
  const maxN = Math.max(...ev.map(g => g.conteo_eval), 1);
  const radio = (g) => 12 + Math.round(14 * g.conteo_eval / maxN);
  /* Empujón suave entre puntos vecinos para que ninguno tape a otro (≈150 px por unidad de escala) */
  const PX = 150; for (let it = 0; it < 40; it++) { let moved = false; for (let i = 0; i < puntos.length; i++) for (let j = i + 1; j < puntos.length; j++) { const a = puntos[i], b = puntos[j]; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 0.001; const min = (radio(a.g) + radio(b.g) + 4) / PX; if (d < min) { const push = (min - d) / 2, ux = dx / d, uy = dy / d; a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push; moved = true; } } if (!moved) break; }
  puntos.forEach(p => { p.x = Math.min(max + 0.3, Math.max(0.7, p.x)); p.y = Math.min(max + 0.3, Math.max(0.7, p.y)); });   // 13 px con 1 calificación → 24 px con el máximo (cabe el número)
  const tick = (v) => Number.isInteger(v) ? v : '';
  chart = new Chart(ctx, { type: 'scatter', data: { datasets: [{ data: puntos, pointRadius: puntos.map(p => radio(p.g)), pointHoverRadius: puntos.map(p => radio(p.g) + 3), pointBackgroundColor: '#09318D', pointBorderColor: '#FCFFFF', pointBorderWidth: 2, clip: false }] },
    options: { responsive: true, maintainAspectRatio: false, layout: { padding: { left: 8, right: 16, top: 16, bottom: 8 } },
      onClick: (e, els) => { if (els.length) fijarDetalle(puntos[els[0].index].g.id); },
      onHover: (e, els) => { if (els.length && !fijado) mostrarDetalle(puntos[els[0].index].g.id); },
      plugins: { legend: { display: false }, tooltip: { displayColors: false, titleFont: { size: 15, weight: 'bold' }, bodyFont: { size: 13 }, padding: 10, callbacks: { title: (c) => `#${NUM[c[0].raw.g.id]} · ${c[0].raw.g.titulo || c[0].raw.g.texto}`, label: (c) => { const g = c.raw.g; const d = (g.descripcion_corta || '').match(/.{1,60}(\s|$)/g) || []; return [...d, `Puntaje ${PT[g.id]} · Impacto ${g.impacto_prom} · Esfuerzo ${g.esfuerzo_prom} · ${g.conteo_eval} calificaciones`]; } } } },
      scales: { x: { min: 0.6, max: max + 0.4, ticks: { stepSize: 0.5, callback: tick, color: '#5A6B94', font: { family: 'JetBrains Mono', size: 11 } }, title: { display: true, text: 'ESFUERZO →', color: '#5A6B94', font: { family: 'JetBrains Mono', size: 11, weight: 500 } }, grid: { color: (c) => c.tick.value === mid ? '#09318D' : (Number.isInteger(c.tick.value) ? '#D8E0EE' : 'transparent') } },
                y: { min: 0.6, max: max + 0.4, ticks: { stepSize: 0.5, callback: tick, color: '#5A6B94', font: { family: 'JetBrains Mono', size: 11 } }, title: { display: true, text: 'IMPACTO ↑', color: '#5A6B94', font: { family: 'JetBrains Mono', size: 11, weight: 500 } }, grid: { color: (c) => c.tick.value === mid ? '#09318D' : (Number.isInteger(c.tick.value) ? '#D8E0EE' : 'transparent') } } } },
    plugins: [{ id: 'quad', beforeDraw(ch) { const { ctx, chartArea: a, scales: { x, y } } = ch; const mx = x.getPixelForValue(mid), my = y.getPixelForValue(mid); ctx.save(); ctx.fillStyle = '#EED2E2'; ctx.fillRect(a.left, a.top, mx - a.left, my - a.top); ctx.font = '900 12px Montserrat'; ctx.fillStyle = '#09318D'; ctx.fillText('HACER YA', a.left + 11, a.top + 22); ctx.fillText('PLANEAR', mx + 11, a.top + 22); ctx.fillText('TAREAS MENORES', a.left + 11, a.bottom - 11); ctx.fillText('POSTERGAR', mx + 11, a.bottom - 11); ctx.restore(); },
      /* La celda seleccionada de la vista: el cuadrante «Hacer ya» (borde azul de 4 px + tirador de 11 px) */
      beforeDatasetsDraw(ch) { const { ctx, chartArea: a, scales: { x, y } } = ch; const mx = x.getPixelForValue(mid), my = y.getPixelForValue(mid); ctx.save(); ctx.strokeStyle = '#09318D'; ctx.lineWidth = 4; ctx.strokeRect(a.left + 2, a.top + 2, mx - a.left - 4, my - a.top - 4); ctx.fillStyle = '#FCFFFF'; ctx.fillRect(mx - 6 - 2, my - 6 - 2, 15, 15); ctx.fillStyle = '#09318D'; ctx.fillRect(mx - 6, my - 6, 11, 11); ctx.restore(); },
      afterDatasetsDraw(ch) { const { ctx } = ch; ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FCFFFF'; ch.getDatasetMeta(0).data.forEach((pt, i) => { const g = puntos[i].g; ctx.font = `bold ${Math.max(11, Math.round(radio(g) * 0.9))}px JetBrains Mono`; ctx.fillText(String(NUM[g.id] || ''), pt.x, pt.y + 1); }); ctx.restore(); } }] });
}
Poll.start(cargar, 4000);
</script>
