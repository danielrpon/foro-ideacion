<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="20261002a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freaknerd_ · Relator de mesa</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<script src="vendor/supabase.min.js"></script>
<style>body{font-family:Montserrat,ui-sans-serif,system-ui,sans-serif}.fn-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}.fn-green{color:#26E57C}.bg-fn{background:#0A0B0D}[hidden]{display:none!important}</style>
<script src="js/config.js?v=20261002a"></script><script src="js/db.js?v=20261002a"></script><script src="js/common.js?v=20261002a"></script><script src="js/acciones.js?v=20261002a"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
<nav data-nav class="bg-fn text-white p-3 flex justify-between items-center shadow-md"></nav>
<div id="errBanner" hidden class="bg-red-600 text-white text-xs text-center py-1"></div>
<main id="app" class="flex-1 p-4 max-w-3xl w-full mx-auto"></main>

<script>
/* Vista del relator de mesa: escribe las acciones que salieron y quedan en el tablero de la junta.
   Los campos y las mesas vienen de la configuración de la junta (junta.html). La lista se refresca
   sola cada 4 s; el formulario NO se vuelve a dibujar, para no borrar lo que el relator está escribiendo. */
const KEY_YO = 'acc_yo_' + DB.SES;
let yo = JSON.parse(localStorage.getItem(KEY_YO) || 'null');   // { mesa, nombre, admin }
let filas = [], editando = null, mesaSel = mesaDeUrl() || (yo ? yo.mesa : ''), cfgKey = '';
const nuevas = Nuevas();
if (yo && mesaDeUrl() && mesaDeUrl() !== yo.mesa && !yo.admin) { yo = null; }   // el QR de otra mesa manda

renderNav('Relator');

/* ---------- entrada ---------- */
function vistaEntrada() {
  const fija = mesaDeUrl() && JUNTA.mesas.some(m => m.slug === mesaDeUrl());
  $('app').innerHTML = `
    <div class="bg-white rounded-2xl shadow p-6 mt-6">
      <div class="fn-mono text-[11px] uppercase tracking-widest text-gray-500">${esc(JUNTA.sesion ? JUNTA.sesion.nombre : 'Junta asesora')}</div>
      <h1 class="text-2xl font-black mt-1">Relator de la mesa</h1>
      <p class="text-sm text-gray-600 mt-2">Aquí se escriben las acciones que acuerda la mesa. Lo que guardes aparece de inmediato en el tablero de la mesa y en el tablero general.</p>
      <label class="block mt-5 text-xs font-bold uppercase tracking-wider text-gray-500">Mesa</label>
      <div class="grid gap-2 mt-2">${JUNTA.mesas.filter(m => !fija || m.slug === mesaSel).map(m => `
        <button onclick="elegirMesa('${esc(m.slug)}')" data-mesa="${esc(m.slug)}" class="mesa-btn press text-left border-2 rounded-xl px-4 py-3 font-bold ${mesaSel === m.slug ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}">
          <i class="fas ${esc(m.icono)} mr-2 ${col(m.color).text}"></i>${esc(m.nombre)}${m.relata ? `<span class="block text-xs font-normal text-gray-500 mt-0.5">Relata: ${esc(m.relata)}</span>` : ''}</button>`).join('')}</div>
      ${fija ? `<a href="${urlVista('acciones.html')}" class="inline-block text-xs text-gray-500 mt-2 underline">No es mi mesa</a>` : ''}
      <label class="block mt-5 text-xs font-bold uppercase tracking-wider text-gray-500">Tu nombre</label>
      <input id="nombre" value="${esc(yo ? yo.nombre : (mesaInfo(mesaSel).relata || ''))}" placeholder="Quién relata la mesa" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 mt-2">
      <label class="block mt-5 text-xs font-bold uppercase tracking-wider text-gray-500">Clave de relator</label>
      <input id="clave" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 mt-2">
      <button onclick="entrar()" class="press w-full bg-fn text-white font-bold rounded-xl py-3 mt-6 hover:opacity-90">Entrar</button>
      <p class="text-xs text-gray-500 mt-3">La clave la da el moderador y solo se necesita para escribir. Los miembros de la mesa ven y descargan las acciones sin clave desde el QR de la mesa.</p>
    </div>`;
}
function elegirMesa(slug) {
  mesaSel = slug;
  document.querySelectorAll('.mesa-btn').forEach(b => {
    const on = b.dataset.mesa === slug;
    b.classList.toggle('border-emerald-500', on); b.classList.toggle('bg-emerald-50', on); b.classList.toggle('border-gray-200', !on);
  });
  const r = mesaInfo(slug).relata; if (r && !$('nombre').value.trim()) $('nombre').value = r;
}
async function entrar() {
  const nombre = $('nombre').value.trim(), clave = $('clave').value.trim();
  if (!mesaSel) return toast('Elige la mesa', 'warn');
  if (!nombre) return toast('Escribe tu nombre', 'warn');
  DB.setClaveMesa(clave);
  let r; try { r = await DB.accionOp('validar'); } catch (e) { return toast(errMsg(e), 'err'); }
  yo = { mesa: mesaSel, nombre, admin: !!(r && r.admin) }; localStorage.setItem(KEY_YO, JSON.stringify(yo));
  arrancar();
}
function salir() { localStorage.removeItem(KEY_YO); DB.setClaveMesa(''); location.href = urlVista('acciones.html'); }

/* ---------- formulario armado con los campos activos ---------- */
function campoHtml(c) {
  const lab = `<label for="f_${c.k}" class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">${esc(c.etiqueta)}${c.obligatorio ? ' <span class="text-red-500">*</span>' : ''}</label>`;
  const cls = 'w-full border-2 border-gray-200 rounded-xl px-3 py-2 focus:border-emerald-500 outline-none';
  if (c.tipo === 'select') return `<div>${lab}<select id="f_${c.k}" class="${cls} bg-white"><option value=""></option>${c.opciones.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`;
  if (c.tipo === 'textarea') return `<div class="sm:col-span-2">${lab}<textarea id="f_${c.k}" rows="2" placeholder="${esc(c.ph || '')}" class="${cls}"></textarea></div>`;
  return `<div>${lab}<input id="f_${c.k}" placeholder="${esc(c.ph || '')}" class="${cls}"></div>`;
}
function vistaMesa() {
  const m = mesaInfo(yo.mesa), obl = JUNTA.campos.filter(c => c.activo && c.obligatorio && !c.fijo).map(c => c.etiqueta.toLowerCase());
  $('app').innerHTML = `
    <div class="flex items-start justify-between gap-4 mt-4">
      <div class="min-w-0"><div class="fn-mono text-[11px] uppercase tracking-widest text-gray-500">Relator · ${esc(yo.nombre)}</div>
        <h1 class="text-2xl font-black"><i class="fas ${esc(m.icono)} mr-2 ${col(m.color).text}"></i>${esc(m.nombre)}</h1>
        ${m.pregunta ? `<p class="text-sm text-gray-600 mt-1">${esc(m.pregunta)}</p>` : ''}</div>
      <div class="text-right shrink-0"><div id="cuenta" class="text-3xl font-black tabular-nums">0</div><div id="cuentaPie" class="text-[11px] uppercase text-gray-500">acciones</div></div>
    </div>

    <div class="bg-white rounded-2xl shadow p-4 mt-4">
      <div id="formTit" class="fn-mono text-[11px] uppercase tracking-widest text-gray-500 mb-2">Nueva acción</div>
      <div class="grid sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2"><label for="f_titulo" class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">${esc(JUNTA.campos[0].etiqueta)} <span class="text-red-500">*</span></label>
          <textarea id="f_titulo" rows="2" placeholder="La acción, en una frase" class="w-full border-2 border-gray-200 rounded-xl px-3 py-2 focus:border-emerald-500 outline-none"></textarea></div>
        ${JUNTA.detalle().map(campoHtml).join('')}
        ${yo.admin ? `<div class="sm:col-span-2"><label class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1">Mesa</label><select id="f_mesa" class="w-full border-2 border-gray-200 rounded-xl px-3 py-2 bg-white">${JUNTA.mesas.map(x => `<option value="${esc(x.slug)}">${esc(x.nombre)}</option>`).join('')}</select></div>` : ''}
      </div>
      <div class="flex gap-2 mt-4">
        <button id="btnGuardar" onclick="guardar()" class="press flex-1 bg-fn text-white font-bold rounded-xl py-3 hover:opacity-90"><i class="fas fa-plus mr-2"></i>Agregar</button>
        <button id="btnCancelar" hidden onclick="cancelar()" class="press px-4 rounded-xl border-2 border-gray-200 font-bold">Cancelar</button>
      </div>
      <p class="text-xs text-gray-500 mt-2">Puedes guardarla a medias y completarla después. Para marcarla como lista necesita ${obl.length ? esc(obl.join(', ').replace(/, ([^,]*)$/, ' y $1')) : 'solo la acción'}.</p>
    </div>

    ${yo.admin ? `<div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 mt-4">
      <div class="fn-mono text-[11px] uppercase tracking-widest text-amber-700 mb-2"><i class="fas fa-key mr-1"></i>Administrador</div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs font-bold text-gray-600">Ver y editar:</span>
        ${JUNTA.mesas.map(x => `<button onclick="verMesa('${esc(x.slug)}')" class="press px-3 py-1.5 rounded-lg text-xs font-bold border-2 ${yo.mesa === x.slug ? 'border-amber-500 bg-white' : 'border-transparent bg-white/60 text-gray-600'}">${esc(x.nombre)}</button>`).join('')}
        <a href="${urlVista('junta.html')}" class="ml-auto px-3 py-1.5 rounded-lg text-xs font-bold bg-white border-2 border-amber-200 text-amber-800"><i class="fas fa-sliders mr-1"></i>Configurar la junta</a>
      </div>
    </div>` : ''}

    <div id="lista" class="mt-4 space-y-2"></div>

    <div class="flex flex-wrap gap-x-3 gap-y-2 justify-center my-8 text-sm font-bold text-gray-600">
      <a href="${urlMesa('tablero.html', yo.mesa)}" target="_blank" class="hover:text-black"><i class="fas fa-tv mr-1"></i>Tablero de la mesa</a>
      <span class="text-gray-300">·</span>
      <a href="${urlVista('tablero.html')}" target="_blank" class="hover:text-black"><i class="fas fa-table-columns mr-1"></i>Tablero general</a>
      <span class="text-gray-300">·</span>
      <button onclick="descargarCsv(nombreArchivo(yo.mesa), accionesCsv(filas.filter(f => f.mesa === yo.mesa)))" class="hover:text-black"><i class="fas fa-file-csv mr-1"></i>CSV</button>
      <span class="text-gray-300">·</span>
      <button onclick="salir()" class="hover:text-black"><i class="fas fa-right-from-bracket mr-1"></i>Salir</button>
    </div>`;
  if ($('f_mesa')) $('f_mesa').value = yo.mesa;
  pintarLista();
}

function pintarLista() {
  if (!$('lista')) return;
  const mias = filas.filter(f => f.mesa === yo.mesa), listas = mias.filter(f => f.estado === 'confirmada').length, nv = nuevas(mias);
  $('cuenta').textContent = mias.length;
  $('cuentaPie').textContent = (mias.length === 1 ? 'acción' : 'acciones') + ' · ' + listas + (listas === 1 ? ' lista' : ' listas');
  $('lista').innerHTML = mias.length ? mias.map((f, i) => tarjetaAccion(f, { num: i + 1, nueva: nv.has(f.id), acciones: botones(f) })).join('') : '<p class="text-center text-gray-400 py-8">Todavía no hay acciones de esta mesa.</p>';
}
function botones(f) {
  const lista = f.estado === 'confirmada', faltan = JUNTA.faltan(f);
  return `<div class="flex gap-1 shrink-0">
    <button onclick="editar(${f.id})" class="press w-9 h-9 rounded-lg border border-gray-200 text-gray-500 hover:text-black" title="Editar" aria-label="Editar"><i class="fas fa-pen text-xs"></i></button>
    <button onclick="alternar(${f.id})" class="press w-9 h-9 rounded-lg border ${lista ? 'border-emerald-500 bg-emerald-50 text-emerald-600' : 'border-gray-200 text-gray-400'}" title="${lista ? 'Reabrir' : faltan.length ? 'Falta: ' + esc(faltan.join(', ')) : 'Marcar lista'}" aria-label="${lista ? 'Reabrir' : 'Marcar lista'}"><i class="fas fa-check text-xs"></i></button>
    <button onclick="borrar(${f.id})" class="press w-9 h-9 rounded-lg border border-gray-200 text-gray-400 hover:text-red-600" title="Borrar" aria-label="Borrar"><i class="fas fa-trash text-xs"></i></button>
  </div>`;
}

/* ---------- formulario ---------- */
const BASE = ['titulo', 'responsable', 'acompana', 'fecha', 'senal'];
function datos() {
  const d = { titulo: $('f_titulo').value.trim(), extra: {} };
  JUNTA.detalle().forEach(c => { const v = $('f_' + c.k).value.trim(); if (c.base) d[c.k] = v; else d.extra[c.k] = v; });
  if ($('f_mesa')) d.mesa = $('f_mesa').value;
  return d;
}
function llenar(f) {
  $('f_titulo').value = f ? f.titulo : '';
  JUNTA.detalle().forEach(c => { $('f_' + c.k).value = f ? JUNTA.val(f, c.k) : ''; });
  if ($('f_mesa')) $('f_mesa').value = f ? f.mesa : yo.mesa;
}
function modo(edit) {
  editando = edit;
  $('formTit').textContent = edit ? 'Editar acción' : 'Nueva acción';
  $('btnGuardar').innerHTML = `<i class="fas fa-${edit ? 'check' : 'plus'} mr-2"></i>${edit ? 'Guardar cambios' : 'Agregar'}`;
  $('btnCancelar').hidden = !edit;
}
function editar(id) { const f = filas.find(x => x.id === id); if (!f) return; llenar(f); modo(f); window.scrollTo({ top: 0, behavior: 'smooth' }); $('f_titulo').focus(); }
function cancelar() { llenar(null); modo(null); }
async function guardar() {
  const d = datos(); if (!d.titulo) { $('f_titulo').focus(); return toast('Escribe la acción', 'warn'); }
  try {
    if (editando) await DB.accionOp('editar', { id: editando.id, ...d });
    else await DB.accionOp('crear', { mesa: yo.mesa, autor: yo.nombre, ...d });
    const faltan = JUNTA.faltan({ ...d, extra: d.extra });
    cancelar(); vibrar(); toast(faltan.length ? 'Guardada · falta ' + faltan.join(', ').toLowerCase() : 'Guardada', faltan.length ? 'warn' : 'ok'); await refrescar();
  } catch (e) { toast(errMsg(e), 'err'); }
}
async function alternar(id) {
  const f = filas.find(x => x.id === id); if (!f) return;
  const lista = f.estado === 'confirmada', faltan = JUNTA.faltan(f);
  if (!lista && faltan.length) { toast('Para marcarla lista falta: ' + faltan.join(', ').toLowerCase(), 'warn'); return editar(id); }
  try { await DB.accionOp(lista ? 'reabrir' : 'confirmar', { id }); await refrescar(); } catch (e) { toast(errMsg(e), 'err'); }
}
async function borrar(id) {
  const f = filas.find(x => x.id === id); if (!f) return;
  if (!confirm('¿Borrar esta acción?\n\n' + f.titulo)) return;
  if (editando && editando.id === id) cancelar();
  try { await DB.accionOp('borrar', { id }); await refrescar(); } catch (e) { toast(errMsg(e), 'err'); }
}
function verMesa(slug) { yo.mesa = slug; localStorage.setItem(KEY_YO, JSON.stringify(yo)); cancelar(); vistaMesa(); }

/* ---------- ciclo ---------- */
async function refrescar() {
  const [ses, acc] = await Promise.all([DB.getSesion(), DB.getAcciones()]);
  filas = acc;
  const k = JSON.stringify(ses && ses.config && ses.config.junta);
  if (k !== cfgKey) {                 // cambió la configuración: redibujar el formulario (conserva lo escrito)
    const primera = !cfgKey; cfgKey = k; JUNTA.leer(ses);
    if (!primera && $('f_titulo')) { const d = datos(), ed = editando; vistaMesa(); llenar({ mesa: d.mesa || yo.mesa, ...d, extra: d.extra }); modo(ed); return; }
  }
  pintarLista();
}
function arrancar() { vistaMesa(); Poll.start(refrescar, 4000); DB.onAccionesChange && DB.onAccionesChange(refrescar); }
(async () => {
  try { const ses = await DB.getSesion(); JUNTA.leer(ses); cfgKey = JSON.stringify(ses && ses.config && ses.config.junta); } catch (e) { toast(errMsg(e), 'err'); }
  if (yo && !JUNTA.mesas.some(m => m.slug === yo.mesa)) yo = null;
  if (yo && !DB.claveMesa) { yo = null; }   // identidad sin clave (sesión vieja): pedirla de nuevo
  yo ? arrancar() : vistaEntrada();
})();
</script>
</body>
</html>
