<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>freaknerd_ · Foro de Ideación · Participante</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<style>summary{list-style:none}summary::-webkit-details-marker{display:none}body{font-family:Montserrat,ui-sans-serif,system-ui,sans-serif}.fn-mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}.fn-green{color:#26E57C}.bg-fn{background:#0A0B0D}</style>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<script src="vendor/supabase.min.js"></script>
<script src="js/config.js?v=20260910c"></script><script src="js/db.js?v=20260910c"></script><script src="js/common.js?v=20260910c"></script>
<style>
  .fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pick{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
  .sticky-top{position:sticky;top:56px;z-index:20}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
</style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">
<nav data-nav class="bg-fn text-white p-3 flex justify-between items-center shadow-md sticky top-0 z-50 border-b border-emerald-500/30"></nav>
<div id="errBanner" hidden class="bg-red-600 text-white text-xs text-center py-1"></div>
<main class="flex-1 p-4"><div id="app" class="max-w-md mx-auto"></div></main>
<script>
const PERFILES = ['Mercadeo / Ventas', 'Finanzas / Inversión', 'Operaciones / Cadena de abastecimiento', 'Gente / Cultura', 'Digital / Tecnología / IA', 'Estrategia / Gerencia general', 'Empresario', 'Otro'];
let snap = null, yo = Yo.get(), pilarSel = null, votosMios = [], evalsMias = {}, viewKey = '', ultimaProyectada = null, consKey = '', sel = {};
renderNav('participante');

async function cargar() {
  snap = await DB.snapshot();
  setNavEtapa(snap.sesion);
  if (yo) {
    if (snap.sesion.etapa === 'votacion') votosMios = await DB.getVotos(yo.id);
    if (snap.sesion.etapa === 'matriz') { evalsMias = {}; (await DB.getEvaluaciones(yo.id)).forEach(e => evalsMias[e.idea_id] = e); }
  }
  render();
}
setInterval(() => { if (yo) DB.ping(yo.id); }, 30000);

function grupos() { return calificables(snap.ideas); }
function misIdeas(pid) { return snap.ideas.filter(i => i.tipo === 'idea' && i.participante_id === yo.id && (!pid || i.pilar_id === pid)); }
function pilar(id) { return snap.pilares.find(p => p.id === id); }
function hijasHtml(g) { const h = snap.ideas.filter(i => i.tipo === 'idea' && i.padre_id === g.id); if (!h.length) return ''; return `<details class="mt-2"><summary class="cursor-pointer text-[11px] font-mono uppercase text-gray-500 select-none"><i class="fas fa-caret-right mr-1"></i>Integra ${h.length} idea(s) · ver</summary><ul class="mt-1 pl-3 border-l-2 border-gray-200 space-y-1">${h.map(i => `<li class="text-xs text-gray-700">${esc(i.texto)}</li>`).join('')}</ul></details>`; }
function chipsPilares(activo, onclick) {
  return `<div class="chips mb-3">${snap.pilares.map(p => { const c = col(p.color); const on = p.id === activo; return `<button onclick="${onclick}(${p.id})" class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold border ${on ? c.solid + ' text-white border-transparent' : 'bg-white ' + c.text + ' ' + c.border}"><i class="fas ${p.icono} mr-1"></i>${esc(p.nombre)}</button>`; }).join('')}</div>`;
}
function espera(titulo, texto, icono = 'fa-pause-circle') {
  return `<div class="flex flex-col items-center justify-center text-center text-gray-500 mt-16 fade-in"><i class="fas ${icono} text-5xl mb-4 text-gray-300"></i><h2 class="text-xl font-bold text-gray-700">${titulo}</h2><p class="mt-2 text-sm">${texto}</p></div>`;
}

function render() {
  const app = $('app'), s = snap.sesion, et = s.etapa;
  if (!yo) {
    if (viewKey !== 'reg') { viewKey = 'reg'; app.innerHTML = `
      <div class="bg-white rounded-xl shadow p-6 mt-4 fade-in">
        <div class="text-center mb-4"><div class="fn-mono text-xs uppercase tracking-[.25em] text-gray-500"><span class="normal-case">freaknerd<span class="text-emerald-600">_</span></span> · foro de ideación</div><img src="img/impercap_logo.png" class="w-20 mx-auto my-3 bg-fn rounded-2xl p-2" onerror="this.style.display='none'"><h1 class="text-2xl font-black">${esc(s.nombre)}</h1><p class="text-sm text-gray-500 mt-1">Caso de negocio nº 1 · regístrate para participar</p></div>
        <label class="block text-xs font-bold text-gray-600 mb-1">Tu nombre</label>
        <input id="regNombre" class="w-full p-3 border rounded-lg mb-3" placeholder="Nombre y apellido" autocomplete="name">
        <label class="block text-xs font-bold text-gray-600 mb-1">Tu perfil (para autosegmentarte)</label>
        <select id="regPerfil" class="w-full p-3 border rounded-lg mb-4 bg-white">${PERFILES.map(p => `<option>${p}</option>`).join('')}</select>
        <button onclick="registrar()" class="w-full bg-fn hover:bg-gray-800 text-emerald-400 font-bold py-3 rounded-lg">Entrar al foro <i class="fas fa-arrow-right ml-1"></i></button>
        <p class="text-[11px] text-gray-400 mt-3 text-center">Tu registro queda guardado en este celular.</p>
      </div>`; }
    return;
  }
  const gs = grupos();
  const key = [et, et === 'ideacion' ? pilarSel : '', et === 'votacion' ? pilarSel + ':' + gs.map(g => g.id).join(',') : '', et === 'matriz' ? s.modo_matriz + ':' + s.proyectada_id + ':' + gs.map(g => g.id).join(',') : ''].join('|');
  const full = key !== viewKey; viewKey = key;

  /* ---------- Apertura ---------- */
  if (['bienvenida', 'instrucciones'].includes(et)) {
    if (!full) return;
    app.innerHTML = `<div class="bg-white rounded-xl shadow p-6 mt-2 fade-in">
      <p class="text-xs font-mono text-emerald-700 uppercase tracking-widest"><span class="normal-case">freaknerd_</span> · Bienvenido</p>
      <h1 class="text-2xl font-black mt-1">Hola, ${esc(yo.nombre.split(' ')[0])} 👋</h1>
      <p class="text-sm text-gray-600 mt-2">${esc(s.config.caso || '')}</p>
      <p class="text-[11px] font-mono uppercase tracking-widest text-gray-400 mt-4">Los pilares · toca uno para ver de qué se trata</p>
      <div class="mt-2 space-y-2">${snap.pilares.map(p => { const c = col(p.color); return `<details class="rounded-lg ${c.bg} overflow-hidden"><summary class="flex items-center gap-3 p-2.5 cursor-pointer"><i class="fas ${p.icono} ${c.text}"></i><span class="text-sm font-bold ${c.text} flex-1">${esc(p.nombre)}</span><i class="fas fa-chevron-down text-xs ${c.text} opacity-60"></i></summary><div class="px-3 pb-3 text-xs text-gray-700">${esc(p.enunciado || '')}${(p.subfrentes && p.subfrentes.length) ? `<div class="mt-2 flex flex-wrap gap-1">${p.subfrentes.map(f => `<span class="px-2 py-0.5 rounded-full bg-white/70 ${c.text} text-[10px] font-bold">${esc(f)}</span>`).join('')}</div>` : ''}</div></details>`; }).join('')}</div>
      <div class="mt-6 text-center text-gray-400 text-sm"><i class="fas fa-circle-notch fa-spin mr-1"></i>Esperando a que el moderador abra la ideación…</div>
      <button onclick="salir()" class="mt-4 text-[11px] text-gray-400 underline w-full text-center">No soy ${esc(yo.nombre)}</button>
    </div>`; return;
  }

  /* ---------- Ideación ---------- */
  if (et === 'ideacion') {
    if (!pilarSel || !pilar(pilarSel)) pilarSel = snap.pilares[0] && snap.pilares[0].id;
    const p = pilar(pilarSel), c = col(p.color), mias = misIdeas(pilarSel), total = misIdeas().length;
    if (full) {
      app.innerHTML = `<div class="fade-in">
        <div class="flex justify-between items-center mb-2"><span class="text-xs font-mono uppercase tracking-widest text-gray-500">Etapa 1 · Ideación</span><span id="tmr" class="font-mono text-sm font-bold ${timerVencido(s) ? 'text-red-600' : 'text-gray-700'}">${timerText(s)}</span></div>
        ${chipsPilares(pilarSel, 'setPilar')}
        <div class="bg-white rounded-xl shadow p-4 border-t-4 ${c.border}">
          <h2 class="font-black text-lg ${c.text}"><i class="fas ${p.icono} mr-1"></i>${esc(p.nombre)}</h2>
          <p class="text-[10px] font-mono uppercase tracking-widest text-gray-400 mt-2">De qué se trata este pilar</p><p class="text-sm text-gray-600 mt-0.5">${esc(p.enunciado || '')}</p>
          ${(p.subfrentes && p.subfrentes.length) ? `<label class="block text-xs font-bold text-gray-600 mt-3 mb-1">Frente</label><select id="subfrente" class="w-full p-2 border rounded-lg bg-white text-sm">${p.subfrentes.map(f => `<option>${esc(f)}</option>`).join('')}<option value="">Otro / general</option></select>` : ''}
          <label class="block text-xs font-bold text-gray-600 mt-3 mb-1">Tu idea (qué haría Mauricio, en una o dos frases)</label>
          <textarea id="txtIdea" rows="4" class="w-full p-3 border rounded-lg text-sm" placeholder="Ej.: Contratar un vendedor de campo para Cali con fijo bajo y comisión alta…"></textarea>
          <button id="btnEnviar" onclick="enviarIdea()" class="mt-3 w-full ${c.solid} text-white font-bold py-3 rounded-lg"><i class="fas fa-paper-plane mr-2"></i>Enviar idea</button>
        </div>
        <div class="mt-4"><div class="flex justify-between items-baseline"><h3 class="text-xs font-bold uppercase text-gray-500">Tus ideas en este pilar</h3><span id="cntTotal" class="text-[11px] text-gray-400">${total} en total</span></div><div id="misIdeas" class="mt-2 space-y-2"></div></div>
      </div>`;
    } else { const t = $('tmr'); if (t) { t.textContent = timerText(s); t.className = 'font-mono text-sm font-bold ' + (timerVencido(s) ? 'text-red-600' : 'text-gray-700'); } const ct = $('cntTotal'); if (ct) ct.textContent = total + ' en total'; }
    $('misIdeas').innerHTML = mias.length ? mias.slice().reverse().map(i => `<div class="postit p-3 rounded-lg ${c.postit} border ${c.border} text-sm">${i.subfrente ? `<span class="text-[10px] font-mono uppercase ${c.text}">${esc(i.subfrente)}</span><br>` : ''}${esc(i.texto)}<div class="text-[10px] text-gray-400 mt-1">${fmtHora(i.created_at)} · ${i.estado === 'agrupada' ? 'agrupada' : i.estado}</div></div>`).join('') : '<p class="text-xs text-gray-400">Aún no has enviado ideas en este pilar.</p>';
    return;
  }

  /* ---------- Consolidación / pausa ---------- */
  if (['instrucciones_consolidacion', 'consolidacion'].includes(et)) {
    const total = misIdeas().length, foro = snap.ideas.filter(i => i.tipo === 'idea').length, g = gs.length;
    const k2 = et + total + '/' + foro + '/' + g; if (!full && k2 === consKey) return; consKey = k2;
    app.innerHTML = `<div class="bg-white rounded-xl shadow p-6 mt-2 text-center fade-in">
      <i class="fas fa-wand-magic-sparkles text-5xl text-purple-400 mb-3"></i>
      <h2 class="text-xl font-black">Consolidando ideas (MECE)</h2>
      <p class="text-sm text-gray-600 mt-2">La IA está agrupando las ideas similares sin perder ninguna. Descansa un momento: en el muro verás el resultado.</p>
      <div class="grid grid-cols-3 gap-2 mt-5"><div class="bg-gray-50 rounded-lg p-3"><div class="text-2xl font-black">${total}</div><div class="text-[10px] uppercase text-gray-500">tus ideas</div></div><div class="bg-gray-50 rounded-lg p-3"><div class="text-2xl font-black">${foro}</div><div class="text-[10px] uppercase text-gray-500">ideas del foro</div></div><div class="bg-gray-50 rounded-lg p-3"><div class="text-2xl font-black text-purple-700">${g}</div><div class="text-[10px] uppercase text-gray-500">consolidadas</div></div></div>
    </div>`; return;
  }
  if (et === 'pausa') { if (full) app.innerHTML = espera('Pausa · cafecito ☕', 'Cuando el moderador retome, tu celular te lleva solo a la siguiente etapa.', 'fa-mug-hot'); return; }

  /* ---------- Votación ---------- */
  if (et === 'instrucciones_votacion') { if (full) app.innerHTML = espera('Ya casi: votación', `Vas a tener ${s.config.votos_por_pilar || 3} votos por pilar para las ideas consolidadas.`, 'fa-check-to-slot'); return; }
  if (et === 'votacion') {
    if (!pilarSel || !pilar(pilarSel)) pilarSel = snap.pilares[0] && snap.pilares[0].id;
    const p = pilar(pilarSel), c = col(p.color), max = s.config.votos_por_pilar || 3;
    const mios = gs.filter(g => g.pilar_id === pilarSel);
    const usados = votosMios.filter(id => (gs.find(g => g.id === id) || {}).pilar_id === pilarSel).length;
    app.innerHTML = `<div class="fade-in">
      <div class="flex justify-between items-center mb-2"><span class="text-xs font-mono uppercase tracking-widest text-gray-500">Etapa 4 · Votación</span><span class="text-xs font-bold ${usados >= max ? 'text-red-600' : 'text-emerald-700'}">Te quedan ${max - usados} de ${max} votos</span></div>
      ${chipsPilares(pilarSel, 'setPilar')}
      <div class="space-y-2">${mios.length ? mios.map(g => { const on = votosMios.includes(g.id); return `<div class="bg-white rounded-xl shadow p-4 border-l-4 ${c.border} ${on ? 'ring-2 ring-emerald-400' : ''}">
        <div class="font-bold">${esc(g.titulo || g.texto)}</div><p class="text-sm text-gray-600 mt-1">${esc(g.descripcion_corta || '')}</p>${hijasHtml(g)}
        <button onclick="toggleVoto(${g.id})" class="mt-2 w-full py-2 rounded-lg font-bold text-sm ${on ? 'bg-emerald-600 text-white' : (usados >= max ? 'bg-gray-200 text-gray-400' : 'bg-gray-100 text-gray-800')}"><i class="fas ${on ? 'fa-check' : 'fa-thumbs-up'} mr-1"></i>${on ? 'Votada · quitar voto' : 'Votar'}</button></div>`; }).join('') : '<p class="text-sm text-gray-400 text-center mt-6">Este pilar aún no tiene ideas consolidadas.</p>'}</div>
    </div>`; return;
  }
  if (et === 'resultados') { if (!full) return; const top = gs.slice().sort((a, b) => b.votos - a.votos).slice(0, 5); app.innerHTML = `<div class="bg-white rounded-xl shadow p-6 mt-2 fade-in"><h2 class="text-xl font-black">Resultados de la votación</h2><p class="text-sm text-gray-500">Mira el muro. Las más votadas:</p><ol class="mt-3 space-y-2 list-decimal pl-5">${top.map(g => `<li class="text-sm"><b>${esc(g.titulo || g.texto)}</b> <span class="text-gray-400">· ${g.votos} votos</span></li>`).join('')}</ol></div>`; return; }

  /* ---------- Matriz ---------- */
  if (et === 'instrucciones_matriz') { if (full) app.innerHTML = espera('Ya casi: matriz esfuerzo · impacto', `Tienes hasta <b>${maxCalif(s, gs.length)} calificaciones</b>: úsalas en las ideas donde tengas criterio y deja pasar las demás. Cada una va de 1 a ${escalaMax(s)} en esfuerzo y en impacto (1 = poco, ${escalaMax(s)} = mucho). Piensa en 3 a 6 meses y en la caja que hay.`, 'fa-chart-line'); return; }
  if (et === 'matriz') {
    const max = escalaMax(s);
    const lista = (s.modo_matriz === 'proyectada') ? gs.filter(g => g.id === s.proyectada_id) : gs;
    if (s.modo_matriz === 'proyectada' && s.proyectada_id && s.proyectada_id !== ultimaProyectada) { ultimaProyectada = s.proyectada_id; vibrar(200); }
    const lim = maxCalif(s, gs.length), hechas = gs.filter(g => evalsMias[g.id]).length, quedan = Math.max(0, lim - hechas);
    if (full) {
      lista.forEach(g => { const e = evalsMias[g.id]; sel[g.id] = e ? { e: e.esfuerzo, i: e.impacto } : (sel[g.id] || { e: null, i: null }); });
      app.innerHTML = `<div class="fade-in">
        <div class="sticky-top bg-gray-100 -mx-4 px-4 py-2 mb-2 border-b"><div class="flex justify-between items-center"><span class="text-xs font-mono uppercase tracking-widest text-gray-500">Etapa 6 · Esfuerzo · Impacto</span><span id="tmr" class="font-mono text-sm font-bold">${timerText(s)}</span></div>
        <div class="flex items-center gap-2 mt-1"><div class="flex-1 h-2 bg-gray-200 rounded"><div id="progBar" class="h-2 rounded ${quedan ? 'bg-emerald-500' : 'bg-gray-800'} transition-all" style="width:${pct(hechas, lim)}%"></div></div><span id="prog" class="text-xs font-bold ${quedan ? 'text-gray-600' : 'text-gray-900'} whitespace-nowrap">${hechas} de ${lim} · te quedan ${quedan}</span></div></div>
        <p class="text-[11px] text-gray-500 mb-2">Tienes hasta <b>${lim}</b> calificaciones para ${gs.length} ideas: úsalas donde tengas criterio. Toca un número por criterio (1 = poco · ${max} = mucho) y guarda.</p>
        ${lista.length ? lista.map(g => { const c = col(g.pilar_color), e = evalsMias[g.id]; return `<div class="bg-white rounded-xl shadow p-4 mb-3 border-l-4 ${c.border}" id="card${g.id}">
          <div class="text-[10px] font-mono uppercase ${c.text}">${esc(g.pilar_nombre || '')}</div>
          <div class="font-bold ${s.modo_matriz === 'proyectada' ? 'text-xl' : ''}">${esc(g.titulo || g.texto)}</div><p class="text-sm text-gray-600 mt-1">${esc(g.descripcion_corta || '')}</p>
          ${s.modo_matriz === 'proyectada' && g.detalle ? `<p class="text-xs text-gray-500 mt-2">${esc(g.detalle)}</p>` : ''}${hijasHtml(g)}
          ${(!e && !quedan) ? `<div class="mt-3 text-xs text-center text-gray-500 bg-gray-50 rounded-lg p-3"><i class="fas fa-lock mr-1"></i>Ya usaste tus ${lim} calificaciones. Para calificar esta, quita una de las guardadas.</div>` : `${pickHtml(g.id, 'e', max, sel[g.id].e)}
          ${pickHtml(g.id, 'i', max, sel[g.id].i)}
          <button id="btn${g.id}" onclick="guardarEval(${g.id})" class="pick mt-3 w-full py-3 rounded-lg font-bold text-sm ${e ? 'bg-emerald-600 text-white' : (sel[g.id].e && sel[g.id].i ? 'bg-gray-900 text-emerald-400' : 'bg-gray-200 text-gray-500')}">${e ? '<i class="fas fa-check mr-1"></i>Guardada · toca un número para cambiar' : 'Guardar calificación'}</button><div id="st${g.id}" class="text-[11px] text-center text-gray-400 mt-1">${e ? 'Puedes cambiar los números y volver a guardar' : 'Elige esfuerzo e impacto'}</div>${e ? `<button onclick="quitarEval(${g.id})" class="pick mt-1 w-full text-[11px] text-red-500 underline">Quitar calificación (libera una)</button>` : ''}`}
        </div>`; }).join('') : espera('Esperando la idea proyectada', 'El moderador va a proyectar una idea en el muro; tu celular vibrará.', 'fa-tv')}
      </div>`;
    } else { const t = $('tmr'); if (t) t.textContent = timerText(s); }
    return;
  }

  /* ---------- Cierre / reporte ---------- */
  if (['cierre', 'reporte'].includes(et)) {
    if (!full) return;
    const max = escalaMax(s);
    const qw = gs.filter(g => g.conteo_eval > 0 && cuadrante(g.esfuerzo_prom, g.impacto_prom, max).key === 'quick').sort((a, b) => b.impacto_prom - a.impacto_prom);
    app.innerHTML = `<div class="bg-white rounded-xl shadow p-6 mt-2 fade-in"><h2 class="text-xl font-black">¡Gracias, ${esc(yo.nombre.split(' ')[0])}!</h2><p class="text-sm text-gray-600 mt-1">Mira el muro: ahí está la matriz del foro. Quick wins identificados:</p>
      <div class="mt-3 space-y-2">${qw.length ? qw.map(g => `<div class="p-3 rounded-lg bg-emerald-50 border border-emerald-300 text-sm"><b>${esc(g.titulo || g.texto)}</b><div class="text-[11px] text-gray-500 mt-1">Impacto ${g.impacto_prom} · Esfuerzo ${g.esfuerzo_prom} · ${g.conteo_eval} calificaciones</div></div>`).join('') : '<p class="text-xs text-gray-400">Todavía no hay quick wins calculados.</p>'}</div></div>`; return;
  }
  if (full) app.innerHTML = espera('Esperando al moderador…', 'Mantén esta pantalla abierta.');
}

async function registrar() {
  const nombre = $('regNombre').value.trim(), perfil = $('regPerfil').value;
  if (nombre.length < 2) return toast('Escribe tu nombre', 'warn');
  try { yo = await DB.registrar(nombre, perfil); Yo.set(yo); viewKey = ''; toast('¡Listo, ' + nombre.split(' ')[0] + '!'); await cargar(); } catch (e) { toast(errMsg(e), 'err'); }
}
function salir() { if (confirm('¿Registrarte con otro nombre?')) { Yo.clear(); yo = null; viewKey = ''; render(); } }
function setPilar(id) { pilarSel = id; viewKey = ''; render(); }
async function enviarIdea() {
  const txt = $('txtIdea').value.trim(); if (txt.length < 5) return toast('Escribe tu idea (mínimo 5 letras)', 'warn');
  const sf = $('subfrente') ? $('subfrente').value : null; $('btnEnviar').disabled = true;
  try { await DB.crearIdea({ pilar_id: pilarSel, subfrente: sf || null, participante_id: yo.id, participante_nombre: yo.nombre, texto: txt }); $('txtIdea').value = ''; toast('Idea enviada ✓'); vibrar(60); await cargar(); }
  catch (e) { toast(errMsg(e), 'err'); } finally { $('btnEnviar').disabled = false; }
}
async function toggleVoto(id) {
  try { if (votosMios.includes(id)) await DB.quitarVoto(id, yo.id); else await DB.votar(id, yo.id); vibrar(40); await cargar(); } catch (e) { toast(errMsg(e), 'err'); }
}
/* Calificación por botones (1..max): sin barras deslizantes, nada se mueve al hacer scroll */
const CRIT = { e: { label: 'Esfuerzo', icon: 'fa-dumbbell', on: 'bg-purple-600 text-white border-purple-600', txt: 'text-purple-700', hint: 'plata, tiempo, gente' }, i: { label: 'Impacto', icon: 'fa-bolt', on: 'bg-blue-600 text-white border-blue-600', txt: 'text-blue-700', hint: 'ventas y caja en 3–6 meses' } };
function pickHtml(id, k, max, val) {
  const c = CRIT[k];
  return `<div class="mt-3"><div class="flex justify-between items-baseline text-xs font-bold"><span class="${c.txt}"><i class="fas ${c.icon} mr-1"></i>${c.label} <span class="font-normal text-gray-400">· ${c.hint}</span></span><span id="v${k}${id}" class="font-mono">${val || '–'}</span></div>
    <div class="grid gap-1.5 mt-1" style="grid-template-columns:repeat(${max},minmax(0,1fr))" id="${k}${id}">${Array.from({ length: max }, (_, n) => n + 1).map(v => `<button type="button" onclick="pick(${id},'${k}',${v})" data-v="${v}" class="pick py-3 rounded-lg font-black text-base border ${val === v ? c.on : 'bg-white text-gray-700 border-gray-300 active:bg-gray-100'}">${v}</button>`).join('')}</div></div>`;
}
function pick(id, k, v) {
  sel[id] = sel[id] || { e: null, i: null }; sel[id][k] = v; const c = CRIT[k];
  const box = $(k + id); if (box) box.querySelectorAll('button').forEach(b => b.className = 'pick py-3 rounded-lg font-black text-base border ' + (Number(b.dataset.v) === v ? c.on : 'bg-white text-gray-700 border-gray-300 active:bg-gray-100'));
  const lbl = $('v' + k + id); if (lbl) lbl.textContent = v; vibrar(20); marcarPendiente(id);
}
function marcarPendiente(id) { const btn = $('btn' + id); const st = $('st' + id); const ok = sel[id] && sel[id].e && sel[id].i; if (btn && !btn.disabled) { btn.className = 'pick mt-3 w-full py-3 rounded-lg font-bold text-sm ' + (ok ? 'bg-gray-900 text-emerald-400' : 'bg-gray-200 text-gray-500'); btn.innerHTML = 'Guardar calificación'; } if (st) st.textContent = ok ? 'Lista para guardar' : (sel[id] && sel[id].e ? 'Falta el impacto' : sel[id] && sel[id].i ? 'Falta el esfuerzo' : 'Elige esfuerzo e impacto'); }
async function guardarEval(id) {
  const v = sel[id] || {}; const esf = Number(v.e), imp = Number(v.i);
  if (!esf || !imp) return toast(!esf && !imp ? 'Elige esfuerzo e impacto' : !esf ? 'Falta el esfuerzo' : 'Falta el impacto', 'warn');
  const gsAll = grupos(), lim = maxCalif(snap.sesion, gsAll.length), usadas = gsAll.filter(g => evalsMias[g.id]).length;
  if (!evalsMias[id] && usadas >= lim) return toast('Ya usaste tus ' + lim + ' calificaciones: quita una para calificar esta.', 'warn');
  const btn = $('btn' + id); if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i>Guardando…'; }
  try { await DB.evaluar(id, yo.id, esf, imp); evalsMias[id] = { idea_id: id, esfuerzo: esf, impacto: imp };
    if (btn) { btn.className = 'pick mt-3 w-full py-3 rounded-lg font-bold text-sm bg-emerald-600 text-white'; btn.innerHTML = '<i class="fas fa-check mr-1"></i>Guardada · toca un número para cambiar'; } $('st' + id).textContent = 'Puedes cambiar los números y volver a guardar'; toast('Calificación guardada ✓'); vibrar(40);
    const n = gsAll.filter(g => evalsMias[g.id]).length; if (n >= lim) toast('Usaste tus ' + lim + ' calificaciones. ¡Gracias! 🎉'); viewKey = ''; render(); }
  catch (e) { toast(errMsg(e), 'err'); if (btn) { btn.innerHTML = 'Reintentar guardar'; btn.className = 'pick mt-3 w-full py-3 rounded-lg font-bold text-sm bg-red-600 text-white'; } }
  finally { if (btn) btn.disabled = false; }
}
async function quitarEval(id) {
  if (!evalsMias[id]) return;
  try { await DB.quitarEvaluacion(id, yo.id); delete evalsMias[id]; sel[id] = { e: null, i: null }; toast('Calificación quitada: tienes una más disponible'); viewKey = ''; render(); } catch (e) { toast(errMsg(e), 'err'); }
}
Poll.start(cargar);
</script>
