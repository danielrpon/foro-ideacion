.portada h1{position:static;width:auto;font:900 var(--tt,76px)/var(--ttl,88px) var(--fn-font);letter-spacing:-.035em;color:var(--fn-blanco);text-wrap:balance}

.barra-pantalla{max-width:1280px;margin:0 auto 22px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:22px}
@page{size:1280px 720px;margin:0}
@page anexo{size:1280px 720px;margin:33px 0 44px}
@media print{
  .noprint{display:none!important}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .lamina{margin:0;outline:0}

  input.inl{border-bottom-color:var(--fn-tinte)}
  .fn-rosa-print,.lamina .q1,table.rk tr.sel td.tsel{background:var(--fn-rosa-print)!important}

}

<script>
let snap = null, rendered = false;
renderNav('reporte');
async function cargar() { snap = await DB.snapshot(); setNavEtapa(snap.sesion); if (!rendered) { rendered = true; render(); } }
/* Zoom de pantalla: las láminas miden 1280 px; en pantallas angostas se reducen (al imprimir vuelven a 1:1) */
function ajustar() { const z = Math.min(1, (window.innerWidth - 22) / 1280); document.querySelector('.pantalla').style.zoom = z; }
window.addEventListener('resize', ajustar);
/* Antes de imprimir se esperan las fuentes (si no, el PDF sale con la tipografía de reemplazo) */
async function imprimir() { try { await document.fonts.load('900 16px Montserrat'); await document.fonts.load('500 16px Montserrat'); await document.fonts.load('500 11px "JetBrains Mono"'); await document.fonts.ready; } catch (e) {} window.print(); }
window.addEventListener('beforeprint', () => { document.querySelector('.pantalla').style.zoom = 1; });
window.addEventListener('afterprint', ajustar);
function render() {
  const s = snap.sesion, max = escalaMax(s), editable = !!DB.clave && sessionStorage.getItem('foro_rol_' + DB.SES);
  const m = marca(s), fecha = new Date().toLocaleDateString('es-CO', { dateStyle: 'long' });
  const gs = calificables(snap.ideas); const ideas = snap.ideas.filter(i => i.tipo === 'idea');
  const nmax = Math.max(...gs.map(g => g.conteo_eval), 1);
  const lista = gs.slice().sort((a, b) => (b.conteo_eval > 0) - (a.conteo_eval > 0) || (puntaje(b, nmax) - puntaje(a, nmax)) || (b.impacto_prom - a.impacto_prom));
  const NUM = {}; lista.filter(g => g.conteo_eval > 0).forEach((g, i) => NUM[g.id] = i + 1);
  const ev = lista.filter(g => g.conteo_eval > 0), qk = (g) => cuadrante(g.esfuerzo_prom, g.impacto_prom, max);
  const nCal = gs.reduce((a, g) => a + g.conteo_eval, 0), nAut = new Set(ideas.map(i => i.participante_nombre || i.participante_id)).size;
  const nQuick = ev.filter(g => qk(g).key === 'quick').length;
  const demo = ideas.length && ideas.every(i => /^Demo · /.test(i.participante_nombre || ''));
  const quienRaw = s.empresa || s.nombre || '';
  const quien = esc(quienRaw);
  /* El nombre de la empresa ya va en el kicker: se quita del titular si viene como «… · Empresa» */
  const tituloRaw = (s.config.titulo_reporte || 'Reporte consolidado final').replace(/\s*[·•|–-]\s*([^·•|–-]+)$/, (m, t) => (quienRaw && t.trim().toLowerCase() === quienRaw.trim().toLowerCase()) || /^grupo mp$/i.test(t.trim()) ? '' : m).trim();
  const titulo = esc(tituloRaw);
  const leyenda = demo ? 'Ejemplo ilustrativo' : `Calificado por el equipo de ${quien} · ${nCal} calificaciones · ${fecha}`;
  const pie = (n, sec) => `<div class="foot mono"><span>${leyenda}</span><span>${String(n).padStart(2, '0')}</span></div>`;
  const top = (sec) => `<div class="top"><span class="wm">freaknerd<i></i></span><div class="mono t2">${titulo.length > 60 ? 'Reporte final' : titulo} · ${sec}</div></div>`;
  const txt = (g) => esc(g.titulo || g.texto);
  const fila = (g, i0) => { const q = g.conteo_eval ? qk(g) : null; const a = g.conteo_eval > 0 && NUM[g.id] === 1; return `<tr${a ? ' class="sel"' : ''}><td class="n">${String(NUM[g.id] || '–').padStart(2, '0')}</td><td class="wr ${a ? 'tsel' : ''}" title="${txt(g)}">${txt(g)}</td><td class="num">${g.conteo_eval ? f1(g.impacto_prom) : '–'}</td><td class="num">${g.conteo_eval ? f1(g.esfuerzo_prom) : '–'}</td><td class="num">${g.conteo_eval ? f1(puntaje(g, nmax)) : '–'}</td><td class="${q && q.key === 'quick' ? 'b' : ''}">${q ? q.label : 'Sin calificar'}</td><td class="wr">${editable ? `<input class="inl" value="${esc(g.responsable || '')}" aria-label="Responsable" onchange="meta(${g.id},'responsable',this.value)">` : esc(g.responsable || '')}</td><td class="wr">${editable ? `<input class="inl" value="${esc(g.tiempo_ejecucion || '')}" aria-label="Tiempo" onchange="meta(${g.id},'tiempo_ejecucion',this.value)">` : esc(g.tiempo_ejecucion || '')}</td></tr>`; };
  const cols = '<colgroup><col style="width:44px"><col style="width:572px"><col style="width:56px"><col style="width:56px"><col style="width:88px"><col style="width:124px"><col style="width:160px"><col style="width:110px"></colgroup>';
  const ths = '<tr><th class="mono"></th><th class="mono">Idea consolidada</th><th class="mono r">Imp.</th><th class="mono r">Esf.</th><th class="mono r">Puntaje</th><th class="mono">Prioridad</th><th class="mono">Responsable</th><th class="mono">Tiempo</th></tr>';
  /* --- 1 · portada --- */
  const logoCli = m ? (m.logo || '') : (logoEmpresa(s) || '');
  let h = `<section class="lamina azul portada"><div class="top"><span class="wm">freaknerd<i></i></span><div class="mono" style="color:var(--fn-tinte)">Reporte final · ${fecha}</div></div><canvas data-fn-campo-blanco></canvas>
    <div class="tt" style="${tituloRaw.length > 28 ? '--tt:40px;--ttl:44px' : ''}"><div class="mono" style="color:var(--fn-tinte);margin-bottom:11px">${esc(tituloEvento(s))} · ${quien}</div><h1>${titulo}</h1>
    <p class="lead">Facilitado por ${esc(s.facilitador || 'freaknerd')}</p></div>${logoCli ? `<img class="cli" src="${esc(logoCli)}" alt="${quien}" onerror="this.style.display='none'">` : ''}</section>`;
  /* --- 2 · resumen --- */
  const orig = ideas.length;
  h += `<section class="lamina">${top('Resumen')}<div class="hd"><h2>${gs.length} ideas consolidadas. ${nQuick} para empezar ya.</h2><p class="sub">${orig} ideas de ${nAut} participantes se agruparon sin perder ninguna y el equipo las calificó en esfuerzo e impacto.</p></div>
    <div class="kp" style="left:35px;top:286px"><div class="v">${orig}</div><div class="l mono t2">Ideas del foro</div></div><div class="kp" style="left:329px;top:286px"><div class="v">${gs.length}</div><div class="l mono t2">Consolidadas</div></div>
    <div class="kp" style="left:35px;top:440px"><div class="v">${nCal}</div><div class="l mono t2">Calificaciones</div></div><div class="kp" style="left:329px;top:440px"><div class="v">${nQuick}</div><div class="l mono t2">Hacer ya</div></div>
    <div class="mono tn" style="position:absolute;left:651px;top:242px;width:594px">Ideas por pilar · originales → consolidadas</div>
    ${snap.pilares.slice(0, 9).map((p, k) => { const n = ideas.filter(i => i.pilar_id === p.id).length, c = gs.filter(g => g.pilar_id === p.id).length, mx = Math.max(...snap.pilares.map(q => ideas.filter(i => i.pilar_id === q.id).length), 1); return `<div class="bar" style="top:${264 + 44 * k}px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.nombre)}</span><div class="tr"><i style="width:${pct(n, mx)}%"></i></div><span class="c">${n}→${c}</span></div>`; }).join('')}
    ${pie(2)}</section>`;
  /* --- 3 · priorización (como lamina.png): tabla de las 6 primeras + matriz --- */
  const top6 = ev.slice(0, 6), mid = umbralMedio(max), lo = 0.6, span = max - 0.2, MW = 594, MH = 264, HX = MW / 2, HY = MH / 2;
  /* 1) los promedios idénticos comparten una sola etiqueta («01·02»); 2) las etiquetas se separan entre sí;
     3) se reservan la esquina inferior derecha de «Hacer ya» (tirador) y la esquina superior izquierda de cada celda (nombre del cuadrante);
     4) cada etiqueta queda dentro de su celda según la MISMA función cuadrante() que cuenta y lista. */
  const grp = {}; ev.forEach(g => { const k = g.esfuerzo_prom + ',' + g.impacto_prom; (grp[k] = grp[k] || []).push(g); });
  const pts = Object.values(grp).map(arr => { const g0 = arr[0], nums = arr.map(g => NUM[g.id]).sort((a, b) => a - b).map(n => String(n).padStart(2, '0'));
    const lab = nums.length <= 2 ? nums.join('·') : nums[0] + '·' + nums[1] + ' +' + (nums.length - 2);
    return { lab, w: Math.max(24, lab.length * 6.6 + 14), q: cuadrante(g0.esfuerzo_prom, g0.impacto_prom, max).key, x: (g0.esfuerzo_prom - lo) / span * MW, y: MH - (g0.impacto_prom - lo) / span * MH }; });
  const celda = { quick: [0, HX, 0, HY], proyecto: [HX, MW, 0, HY], relleno: [0, HX, HY, MH], descartar: [HX, MW, HY, MH] };
  const vetos = [[0, 105, 0, 36], [HX, HX + 90, 0, 36], [0, 120, HY, HY + 36], [HX, HX + 100, HY, HY + 36], [HX - 30, HX + 8, HY - 34, HY + 8]]; /* etiquetas de cuadrante + tirador */
  const situar = (p) => { const [x0, x1, y0, y1] = celda[p.q], hw = p.w / 2 + 3, hh = 15;
    p.x = Math.min(x1 - hw, Math.max(x0 + hw, p.x)); p.y = Math.min(y1 - hh, Math.max(y0 + hh, p.y));
    vetos.forEach(([a, b, c, d]) => { if (p.x + p.w / 2 > a && p.x - p.w / 2 < b && p.y + 12 > c && p.y - 12 < d) { const dy = d + 12 - p.y, dx = b + p.w / 2 - p.x, mv = (p.y + dy + hh <= y1) && (dy <= dx || p.x + dx + hw > x1); if (mv) p.y += dy; else p.x = Math.min(x1 - hw, p.x + dx); } }); };
  for (let it = 0; it < 120; it++) { let mv = false;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], ox = (a.w + b.w) / 2 + 3 - Math.abs(b.x - a.x), oy = 27 - Math.abs(b.y - a.y);
      if (ox > 0 && oy > 0) { mv = true; if (oy <= ox) { const k = (oy / 2 + .5) * (b.y >= a.y ? 1 : -1); a.y -= k; b.y += k; } else { const k = (ox / 2 + .5) * (b.x >= a.x ? 1 : -1); a.x -= k; b.x += k; } } }
    pts.forEach(situar); if (!mv) break; }
  h += `<section class="lamina">${top('Priorización')}<div class="hd"><h2>${nQuick} ideas para empezar ya.</h2><p class="sub">La matriz usa el promedio del equipo. El número de cada punto es su prioridad: impacto menos esfuerzo, ponderado por cuánta gente calificó.</p></div>
    <table class="rk" style="left:35px;top:308px;width:594px"><colgroup><col style="width:30px"><col style="width:324px"><col style="width:54px"><col style="width:54px"><col style="width:132px"></colgroup><tr><th class="mono s"></th><th class="mono">Idea consolidada</th><th class="mono r">Imp.</th><th class="mono r">Esf.</th><th class="mono">Prioridad</th></tr>
    ${top6.map(g => `<tr><td class="n">${String(NUM[g.id]).padStart(2, '0')}</td><td class="wr" title="${txt(g)}">${txt(g)}</td><td class="num">${f1(g.impacto_prom)}</td><td class="num">${f1(g.esfuerzo_prom)}</td><td class="${qk(g).key === 'quick' ? 'b' : ''}">${qk(g).label}</td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--fn-azul-nota)">Aún no hay ideas calificadas.</td></tr>'}</table>
    <div class="mx"><div class="q q1"><b>Hacer ya</b></div><div class="q q2"><b>Planear</b></div><div class="q q3"><b>Tarea menor</b></div><div class="q q4"><b>Postergar</b></div>
    ${pts.map(p => `<span class="d" style="left:${p.x.toFixed(0)}px;top:${p.y.toFixed(0)}px;width:${Math.round(p.w)}px">${p.lab}</span>`).join('')}
    <span class="ax mono" style="left:-50px;top:121px;transform:rotate(-90deg)">Impacto ↑</span><span class="ax mono" style="right:0;top:268px">Esfuerzo →</span></div>
    ${pie(3)}</section>`;
  /* --- 4… · ranking completo, 9 filas por lámina --- */
  const porPag = 9, pags = Math.max(1, Math.ceil(lista.length / porPag));
  for (let k = 0; k < pags; k++) {
    h += `<section class="lamina">${top('Ranking')}<h2 style="width:1000px;font-size:32px">Ranking completo${pags > 1 ? ` (${k + 1} de ${pags})` : ''}</h2>
      <table class="rk" style="left:35px;top:154px;width:1210px">${cols}${ths}${lista.slice(k * porPag, (k + 1) * porPag).map(fila).join('') || '<tr><td colspan="8" style="color:var(--fn-azul-nota)">Aún no hay ideas consolidadas.</td></tr>'}</table>
      <div class="foot mono"><span>${leyenda}</span><span>${String(4 + k).padStart(2, '0')}</span></div></section>`;
  }
  /* --- anexos --- */
  h += `<section class="anexo"><h2>Anexo A · ideas originales detrás de cada consolidada</h2>${lista.map(g => { const hs = ideas.filter(i => i.padre_id === g.id); return `<div class="blq"><div><span class="mono tn">${String(NUM[g.id] || '–').padStart(2, '0')} · ${esc(g.pilar_nombre || '')}</span></div><b>${txt(g)}</b>${g.descripcion_corta ? `<div class="t2">${esc(g.descripcion_corta)}</div>` : ''}${hs.length ? `<ul>${hs.map(x => `<li>${esc(x.texto)} <span class="au">· ${esc(x.participante_nombre || '')}</span></li>`).join('')}</ul>` : ''}</div>`; }).join('')}</section>`;
  h += `<section class="anexo b"><h2>Anexo B · todas las ideas del foro (${ideas.length})</h2>${snap.pilares.map(p => { const mi = ideas.filter(i => i.pilar_id === p.id); return `<h3>${esc(p.nombre)} (${mi.length})</h3><ol>${mi.map(i => `<li class="${i.estado === 'repetida' ? 'tach' : ''}">${esc(i.texto)} <span class="au">· ${esc(i.participante_nombre || '')}${i.subfrente ? ' · ' + esc(i.subfrente) : ''}</span></li>`).join('')}</ol>`; }).join('')}<p class="mono tn" style="margin-top:22px">${m ? esc(tituloEvento(s)) + ' · facilitado por freaknerd' : 'freaknerd · Foro de ideación'} · generado ${new Date().toLocaleString('es-CO')}</p></section>`;
  $('app').innerHTML = `<div class="barra-pantalla noprint"><p class="text-xs text-fn-texto2">${editable ? 'Puedes escribir responsable y tiempo directamente en el ranking (se guardan al salir del campo).' : 'Para asignar responsables y tiempos, entra primero como administrador o líder.'}</p><button onclick="imprimir()" class="btn-fn">Imprimir / PDF ${CHEV}</button></div>${h}`;
  const cv = document.querySelector('canvas[data-fn-campo-blanco]'); if (cv) puntosBlancos(cv);
  ajustar(); window.__reporteListo = true;
}
/* Campo de puntos sobre azul (portada): mismos puntos, en blanco, de disperso (izquierda) a ordenado (derecha) */
function puntosBlancos(c) {
  const w = 520, h = 720, dpr = 2; c.width = w * dpr; c.height = h * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
  let sd = 5; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647, G = 22;
  for (let gx = 11; gx <= w; gx += G) for (let gy = 11; gy <= h; gy += G) { const t = Math.min(1, gx / (w * .85)), e = t * t * (3 - 2 * t), j = (1 - e) * 14; if (r() > .2 + .8 * e) continue; x.globalAlpha = .15 + .7 * e; x.fillStyle = '#FCFFFF'; x.beginPath(); x.arc(gx + (r() - .5) * 2 * j, gy + (r() - .5) * 2 * j, 1.2 + 1.1 * e, 0, 7); x.fill(); }
}
async function meta(id, campo, valor) { try { await DB.admin('editar_idea', { id, [campo]: valor }); toast('Guardado'); } catch (e) { toast(errMsg(e), 'err'); } }
Poll.start(cargar, 15000);
